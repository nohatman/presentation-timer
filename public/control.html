<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Control</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #121212;
            color: #e5e5e5;
        }
        .wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(320px, 1fr));
            grid-auto-rows: minmax(90px, auto);
            gap: 16px;
        }
        h1 {
            color: #fafafa;
            text-align: left;
            margin: 0 0 8px 0;
            grid-column: 1 / -1;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .section {
            margin: 0;
            padding: 14px;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            background: #1a1a1a;
            transition: border-color 0.2s;
        }
        .section:hover {
            border-color: #3a3a3a;
        }
        .section h3 {
            margin: 0 0 12px 0;
            font-size: 1.1rem;
            color: #f5f5f5;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #cfcfcf;
        }
        label.radio-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.05rem;
        }
        label.radio-label:hover {
            border-color: #90caf9;
            background: #202020;
        }
        label.radio-label input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }
        label.checkbox-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.05rem;
            margin-bottom: 10px;
        }
        label.checkbox-label:hover {
            border-color: #90caf9;
            background: #202020;
        }
        label.checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }
        input[type="number"],
        input[type="time"],
        input[type="text"] {
            max-width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 1rem;
            background: #101010;
            color: #e5e5e5;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="number"],
        input[type="time"],
        input.time-text {
            max-width: 100px;
        }
        input[type="time"] {
            max-width: 140px;
        }
        input#speed {
            max-width: 80px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #90caf9;
            background: #151515;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 0.5;
        }
        .time-input {
            display: flex;
            gap: 0.5rem;
        }
        .time-input input {
            flex: 1;
        }
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: flex-start;
            margin-top: 6px;
        }
        .button {
            padding: 12px 16px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            background: #2a2a2a;
            color: #e5e5e5;
            font-weight: 500;
        }
        .button:active {
            transform: scale(0.97);
        }
        .button.primary {
            background: #2e7d32; /* green */
            color: #fff;
            box-shadow: 0 2px 4px rgba(46, 125, 50, 0.3);
        }
        .button.primary:hover {
            background: #256628;
            box-shadow: 0 4px 8px rgba(46, 125, 50, 0.4);
        }
        .button.secondary {
            background: #3a3a3a;
            color: #e5e5e5;
        }
        .button.secondary:hover {
            background: #4a4a4a;
        }
        .button.danger {
            background: #b71c1c;
            color: #fff;
            box-shadow: 0 2px 4px rgba(183, 28, 28, 0.3);
        }
        .button.danger:hover {
            background: #941616;
            box-shadow: 0 4px 8px rgba(183, 28, 28, 0.4);
        }
        .presets {
            display: grid;
            grid-template-columns: repeat(4, minmax(90px, 1fr));
            gap: 8px;
        }
        .preset-button {
            padding: 12px 10px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.05rem;
            color: #e5e5e5;
            text-align: center;
            transition: all 0.2s;
        }
        .preset-button:hover {
            background: #3a3a3a;
            border-color: #90caf9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .preset-button:active {
            transform: translateY(0);
        }
        .status {
            display: none;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 10px;
        }
        .status-badge.running {
            background: rgba(46, 125, 50, 0.3);
            color: #9be7a1;
        }
        .status-badge.paused {
            background: rgba(255, 193, 7, 0.25);
            color: #ffda6a;
        }
        .status-badge.stopped {
            background: rgba(220, 53, 69, 0.25);
            color: #f1aeb5;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .timer-preview {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            background: #0a0a0a;
            color: #4caf50;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .timer-preview.amber { color: #ffb300; }
        .timer-preview.red { color: #f44336; }
        .timer-preview.white { color: #e5e5e5; }
        .timer-control-row {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 16px;
            align-items: stretch;
        }
        .timer-control-row .section {
            margin: 0;
        }
        .main-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .mode-button {
            padding: 8px 12px;
            background: #2a2a2a;
            border: 2px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #e5e5e5;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .mode-button:hover {
            border-color: #90caf9;
        }
        .mode-button.active {
            background: #1565c0;
            border-color: #1976d2;
            color: #fff;
        }
        .mode-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .threshold-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .end-time-display {
            font-size: 0.9rem;
            color: #90caf9;
            font-family: monospace;
            margin-left: 8px;
        }
        .room-header {
            grid-column: 1 / -1;
            background: rgba(144, 202, 249, 0.1);
            border: 2px solid rgba(144, 202, 249, 0.3);
            padding: 16px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .room-name-display {
            font-size: 1.8rem;
            font-weight: 600;
            color: #90caf9;
            font-family: monospace;
        }
        .preview {
            height: 60px;
            border-radius: 6px;
            margin: 8px 0 0;
            transition: background 0.3s;
        }
        .links {
            text-align: left;
            margin-top: 6px;
        }
        .links a {
            color: #90caf9;
            text-decoration: none;
            margin: 0 1rem;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="wrapper">
    <div class="container">
        <div style="grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h1 style="margin: 0;">Timer Control</h1>
            <div class="links" style="border: none; padding: 0; text-align: right;">
                <a href="#" id="displayLink" target="_blank">Open Display Screen</a>
                <span style="color: #666; margin: 0 8px;">|</span>
                <a href="/">Home / New Room</a>
            </div>
        </div>

        <div class="room-header">
            <div>
                <div style="font-size: 0.9rem; color: #999; margin-bottom: 4px;">Room</div>
                <div class="room-name-display" id="roomName"></div>
            </div>
            <button class="button secondary" style="padding: 10px 16px;" onclick="copyRoomLinks()">📋 Copy Links</button>
        </div>

        <div class="timer-control-row">
            <div class="section">
                <h3>Timer Preview <span class="status-badge" id="statusBadge">Stopped</span></h3>
                <div class="timer-preview" id="timerPreview">00:00</div>
            </div>
            <div class="section main-buttons">
                <button class="button primary" onclick="startTimer()" style="font-size: 1.05rem; padding: 14px; flex: 1;">▶️ Start</button>
                <div style="display: flex; gap: 10px; flex: 1;">
                    <button class="button secondary" onclick="pauseTimer()" style="flex: 1;">⏸️ Pause</button>
                    <button class="button secondary" onclick="resumeTimer()" style="flex: 1;">▶️ Resume</button>
                    <button class="button danger" onclick="resetTimer()" style="flex: 1;">⏹️ Reset</button>
                </div>
                <div style="display: flex; gap: 8px; flex: 1;">
                    <button class="button secondary" onclick="nudge(-5*60*1000)" style="flex: 1; font-size: 0.85rem; padding: 8px;">-5 min</button>
                    <button class="button secondary" onclick="nudge(-60*1000)" style="flex: 1; font-size: 0.85rem; padding: 8px;">-1 min</button>
                    <button class="button secondary" onclick="nudge(60*1000)" style="flex: 1; font-size: 0.85rem; padding: 8px;">+1 min</button>
                    <button class="button secondary" onclick="nudge(5*60*1000)" style="flex: 1; font-size: 0.85rem; padding: 8px;">+5 min</button>
                </div>
            </div>
        </div>

        <div class="status" id="status">Loading...</div>

        <div class="section">
            <h3>Timer Mode</h3>
            <div class="mode-row">
                <button class="mode-button active" id="modeDurationBtn" onclick="setTimerMode('duration')">Duration</button>
                <input type="text" id="duration" class="time-text" placeholder="0:00" pattern="\d{1,3}:\d{2}" title="Format: MM:SS (e.g., 30:00)" maxlength="6" inputmode="numeric">
            </div>
            <div class="mode-row">
                <button class="mode-button" id="modeEndAtBtn" onclick="setTimerMode('endAt')" title="Select an end time first">End At</button>
                <input type="time" id="endAtTime">
                <span class="end-time-display" id="endTimeCalc"></span>
            </div>
        </div>

        <div class="section">
            <h3>Quick Presets</h3>
            <div class="presets" id="presetsGrid"></div>
            <small style="display: block; margin-top: 8px; color: #999;">Ctrl+Click to save</small>
        </div>

        <div class="section">
            <h3>Warning Thresholds</h3>
            <div class="threshold-row">
                <div>
                    <label for="amberThreshold" style="font-size: 0.9rem;">Amber</label>
                    <input type="text" id="amberThreshold" class="time-text" placeholder="0:00" pattern="\d{1,3}:\d{2}" title="Format: MM:SS" maxlength="6" inputmode="numeric">
                </div>
                <div>
                    <label for="redThreshold" style="font-size: 0.9rem;">Red</label>
                    <input type="text" id="redThreshold" class="time-text" placeholder="0:00" pattern="\d{1,3}:\d{2}" title="Format: MM:SS" maxlength="6" inputmode="numeric">
                </div>
            </div>
        </div>

        <div class="section">
            <h3>Display Options</h3>
            <label class="checkbox-label">
                <input type="checkbox" id="countUp">
                <span>Count up after zero</span>
            </label>
            <div class="form-group">
                <label style="font-size: 0.9rem;">Output Mode</label>
                <div class="button-group" style="margin-top: 8px;">
                    <button class="button" id="modeTimerBtn" onclick="setOutputMode('timer')" style="flex: 1;">⏱️ Timer</button>
                    <button class="button" id="modeClockBtn" onclick="setOutputMode('clock')" style="flex: 1;">🕐 Time of day</button>
                </div>
            </div>
        </div>

        <!-- Speed Multiplier - Full Width -->
        </div>
        <div class="section" style="margin-top: 30px; border-top: 2px solid #333; padding-top: 20px;">
            <h3>Speed Multiplier</h3>
            <div style="background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 20px;">
                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                    <label for="speedSlider" style="font-size: 0.9rem; min-width: 60px;">Speed:</label>
                    <input type="range" id="speedSlider" min="0.5" max="1.5" step="0.05" value="1.0" 
                           style="flex: 1; height: 6px; border-radius: 3px; background: #333; accent-color: #4caf50;">
                    <span id="speedValue" style="min-width: 50px; font-weight: bold; color: #4caf50;">1.0x</span>
                </div>
                
                <div id="speedPreview" style="padding: 15px; background: #0a0a0a; border-radius: 6px; margin-bottom: 15px; min-height: 80px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div>
                            <div style="font-size: 0.85rem; color: #999; margin-bottom: 4px;">Real-time Duration</div>
                            <div id="realTimeDuration" style="font-size: 1.1rem; color: #e5e5e5;">--:-- → --:--</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 0.85rem; color: #999; margin-bottom: 4px;">Will End At</div>
                            <div id="speedEndTime" style="font-size: 1.1rem; color: #e5e5e5;">--:--:--</div>
                        </div>
                    </div>
                    <div style="border-top: 1px solid #333; padding-top: 10px; margin-top: 10px;">
                        <div style="font-size: 0.85rem; color: #999; margin-bottom: 4px;">Preview Speed</div>
                        <div id="speedAnimation" style="font-family: monospace; font-size: 1.2rem; color: #4caf50;">0</div>
                    </div>
                </div>
                
                <button onclick="applySpeed()" class="btn" style="width: 100%; background: #4caf50; color: white; font-weight: bold; padding: 14px;">
                    Apply Speed Change
                </button>
            </div>
        </div>
        <div class="container">




    </div>
    </div>

    <script>
        // Get room from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        
        // Update room info display
        document.getElementById('roomName').textContent = roomId;
        
        // Update display link with room parameter
        const displayLink = document.getElementById('displayLink');
        displayLink.href = `/display?room=${encodeURIComponent(roomId)}`;

        // Global state
        let currentState = { mode: 'stopped', durationMs: 0, speed: 1.0 };
        let currentTimerMode = 'duration'; // 'duration' or 'endAt'

        // Timer mode selection
        function setTimerMode(mode) {
            if (mode === 'endAt') {
                const endAtTime = document.getElementById('endAtTime').value;
                if (!endAtTime) {
                    alert('Please select an end time first');
                    return;
                }
            }
            currentTimerMode = mode;
            document.getElementById('modeDurationBtn').classList.toggle('active', mode === 'duration');
            document.getElementById('modeEndAtBtn').classList.toggle('active', mode === 'endAt');
            updateEndTimeCalc();
            emitSettings();
        }

        // Update calculated end time display
        function updateEndTimeCalc() {
            const display = document.getElementById('endTimeCalc');
            if (currentTimerMode === 'duration') {
                const durationMs = getDurationMs();
                if (durationMs > 0) {
                    const endTime = new Date(Date.now() + durationMs);
                    const hours = endTime.getHours().toString().padStart(2, '0');
                    const minutes = endTime.getMinutes().toString().padStart(2, '0');
                    const seconds = endTime.getSeconds().toString().padStart(2, '0');
                    display.textContent = `→ ends at ${hours}:${minutes}:${seconds}`;
                } else {
                    display.textContent = '';
                }
            } else {
                // endAt mode - show the target end time with seconds
                const endAtTime = document.getElementById('endAtTime').value;
                if (endAtTime) {
                    const [h, m] = endAtTime.split(':');
                    const now = new Date();
                    const target = new Date(now);
                    target.setHours(parseInt(h || '0'), parseInt(m || '0'), 0, 0);
                    if (target <= now) {
                        target.setDate(target.getDate() + 1);
                    }
                    const hours = target.getHours().toString().padStart(2, '0');
                    const minutes = target.getMinutes().toString().padStart(2, '0');
                    const seconds = target.getSeconds().toString().padStart(2, '0');
                    display.textContent = `→ ends at ${hours}:${minutes}:${seconds}`;
                } else {
                    display.textContent = '';
                }
            }
        }

        // Update end time calc when duration changes
        document.getElementById('duration').addEventListener('input', updateEndTimeCalc);
        document.getElementById('endAtTime').addEventListener('input', updateEndTimeCalc);
        displayLink.href = `/display?room=${encodeURIComponent(roomId)}`;
        
        // Connect socket with room parameter
        const socket = io({ query: { room: roomId } });

        // Helper functions for MM:SS format
        function parseTimeInput(value) {
            if (!value) return { min: 0, sec: 0 };
            const parts = value.split(':');
            const min = parseInt(parts[0]) || 0;
            const sec = parseInt(parts[1]) || 0;
            return { min, sec };
        }

        function formatTimeInput(minutes, seconds) {
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function validateAndFormatTimeInput(input) {
            let value = input.value.replace(/[^0-9:]/g, '');
            const parts = value.split(':');
            if (parts.length === 2) {
                const min = parseInt(parts[0]) || 0;
                let sec = parseInt(parts[1]) || 0;
                if (sec > 59) sec = 59;
                input.value = formatTimeInput(min, sec);
            }
        }

        // Add blur event listeners for auto-formatting
        ['duration', 'amberThreshold', 'redThreshold'].forEach(id => {
            const input = document.getElementById(id);
            input.addEventListener('blur', () => validateAndFormatTimeInput(input));
        });

        // Copy room links function
        function copyRoomLinks() {
            const baseUrl = window.location.origin;
            const text = `Room: ${roomId}\nControl: ${baseUrl}/control?room=${encodeURIComponent(roomId)}\nDisplay: ${baseUrl}/display?room=${encodeURIComponent(roomId)}`;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ Copied!';
                setTimeout(() => btn.textContent = originalText, 2000);
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }

        socket.on('timerState', (state) => {
            currentState = state;
            updateStatus();
            updateTimerPreview();
        });

        function updateStatus() {
            const statusBadge = document.getElementById('statusBadge');
            const modeClass = currentState.mode;
            statusBadge.className = `status-badge ${modeClass}`;
            statusBadge.textContent = modeClass.charAt(0).toUpperCase() + modeClass.slice(1);
        }

        function updateTimerPreview() {
            const previewEl = document.getElementById('timerPreview');
            
            // If in clock mode, show current time in white
            if (currentState.showClock) {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const seconds = now.getSeconds().toString().padStart(2, '0');
                previewEl.textContent = `${hours}:${minutes}:${seconds}`;
                previewEl.className = 'timer-preview white';
                return;
            }
            
            // Calculate remaining time
            let remainingMs = 0;
            if (currentState.mode === 'running' || currentState.mode === 'paused') {
                const elapsed = currentState.mode === 'running' 
                    ? (Date.now() - currentState.startTime - currentState.accumulatedPauseMs) * currentState.speed
                    : (currentState.pauseTime - currentState.startTime - currentState.accumulatedPauseMs) * currentState.speed;
                remainingMs = Math.max(0, currentState.durationMs - elapsed);
            } else {
                remainingMs = currentState.durationMs || 0;
            }

            // Format time
            const totalSec = Math.floor(remainingMs / 1000);
            const min = Math.floor(totalSec / 60);
            const sec = totalSec % 60;
            previewEl.textContent = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;

            // Set color based on thresholds
            previewEl.className = 'timer-preview';
            if (remainingMs <= currentState.redThresholdMs) {
                previewEl.classList.add('red');
            } else if (remainingMs <= currentState.amberThresholdMs) {
                previewEl.classList.add('amber');
            }
        }

        // Update preview every second (always, including for clock mode)
        setInterval(() => {
            if (currentState.mode === 'running' || currentState.showClock) {
                updateTimerPreview();
            }
        }, 1000);

        function getDurationMs() {
            const { min, sec } = parseTimeInput(document.getElementById('duration').value);
            return (min * 60 + sec) * 1000;
        }

        function getAmberThresholdMs() {
            const { min, sec } = parseTimeInput(document.getElementById('amberThreshold').value);
            return (min * 60 + sec) * 1000;
        }

        function getRedThresholdMs() {
            const { min, sec } = parseTimeInput(document.getElementById('redThreshold').value);
            return (min * 60 + sec) * 1000;
        }

        function startTimer() {
            const mode = currentTimerMode;
            const data = {
                speed: parseFloat(document.getElementById('speed').value) || 1.0,
                amberThresholdMs: getAmberThresholdMs(),
                redThresholdMs: getRedThresholdMs(),
                countUp: document.getElementById('countUp').checked
            };

            if (mode === 'duration') {
                data.durationMs = getDurationMs();
            } else {
                data.endAtTarget = document.getElementById('endAtTime').value;
                // Compute duration locally to avoid server timezone issues
                const now = new Date();
                const end = new Date(now);
                const [h, m] = (data.endAtTarget || '00:00').split(':');
                end.setHours(parseInt(h||'0'), parseInt(m||'0'), 0, 0);
                if (end <= now) {
                    end.setDate(end.getDate() + 1);
                }
                data.durationMs = Math.max(0, end.getTime() - now.getTime());
            }

            socket.emit('startTimer', data);
        }

        function pauseTimer() {
            socket.emit('pauseTimer');
        }

        function resumeTimer() {
            socket.emit('resumeTimer');
        }

        function resetTimer() {
            socket.emit('resetTimer');
        }

        // Presets: 8 editable slots persisted in localStorage
        const DEFAULT_PRESETS = [5,10,15,20,25,30,35,45].map(m=>m*60*1000);
        function loadPresets() {
            try {
                const raw = localStorage.getItem('timerPresets');
                const arr = raw ? JSON.parse(raw) : DEFAULT_PRESETS;
                if (Array.isArray(arr) && arr.length === 8) return arr;
            } catch {}
            return DEFAULT_PRESETS;
        }
        function savePresets(presets) {
            localStorage.setItem('timerPresets', JSON.stringify(presets));
        }
        function msToLabel(ms){
            const min = Math.floor(ms/60000);
            const sec = Math.floor((ms%60000)/1000);
            return `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }
        function renderPresets(){
            const grid = document.getElementById('presetsGrid');
            grid.innerHTML='';
            const presets = loadPresets();
            presets.forEach((ms,idx)=>{
                const btn = document.createElement('button');
                btn.className='preset-button';
                btn.textContent = msToLabel(ms);
                btn.title = 'Click to apply; Ctrl+Click to save current duration to this preset';
                btn.addEventListener('click', (e)=>{
                    if (e.ctrlKey || e.metaKey){
                        // save current duration to this preset
                        const newMs = getDurationMs();
                        const updated = loadPresets();
                        updated[idx]=newMs;
                        savePresets(updated);
                        renderPresets();
                    } else {
                        applyPreset(ms);
                    }
                });
                grid.appendChild(btn);
            });
        }
        function applyPreset(durationMs) {
            const minutes = Math.floor(durationMs / (60 * 1000));
            const seconds = Math.floor((durationMs % (60 * 1000)) / 1000);
            document.getElementById('duration').value = formatTimeInput(minutes, seconds);
            setTimerMode('duration');
            emitSettings();
        }

        // Nudge helpers
        function nudge(deltaMs){
            socket.emit('nudgeTimer', deltaMs);
        }

        // Output mode toggle
        function setOutputMode(mode){
            socket.emit('setOutputMode', mode);
            // also mirror immediate UI feedback
            document.getElementById('modeTimerBtn').classList.toggle('primary', mode==='timer');
            document.getElementById('modeClockBtn').classList.toggle('primary', mode==='clock');
        }

        // Speed multiplier preview functions
        let speedAnimationInterval = null;
        let speedAnimationCounter = 0;

        function updateSpeedPreview() {
            const speed = parseFloat(document.getElementById('speedSlider').value);
            document.getElementById('speedValue').textContent = speed.toFixed(2) + 'x';

            // Calculate real-time duration
            const durationMs = getDurationMs();
            const realTimeMs = durationMs / speed;
            const durationMin = Math.floor(durationMs / 60000);
            const durationSec = Math.floor((durationMs % 60000) / 1000);
            const realMin = Math.floor(realTimeMs / 60000);
            const realSec = Math.floor((realTimeMs % 60000) / 1000);
            document.getElementById('realTimeDuration').textContent = 
                `${durationMin}:${durationSec.toString().padStart(2, '0')} → ${realMin}:${realSec.toString().padStart(2, '0')} real-time`;

            // Calculate end time
            const now = new Date();
            const endTime = new Date(now.getTime() + realTimeMs);
            const hours = endTime.getHours().toString().padStart(2, '0');
            const minutes = endTime.getMinutes().toString().padStart(2, '0');
            const seconds = endTime.getSeconds().toString().padStart(2, '0');
            document.getElementById('speedEndTime').textContent = `${hours}:${minutes}:${seconds}`;

            // Update animation speed
            if (speedAnimationInterval) {
                clearInterval(speedAnimationInterval);
            }
            const baseInterval = 1000; // 1 second base
            const animInterval = baseInterval / speed;
            speedAnimationCounter = 0;
            speedAnimationInterval = setInterval(() => {
                speedAnimationCounter++;
                document.getElementById('speedAnimation').textContent = speedAnimationCounter;
            }, animInterval);
        }

        function applySpeed() {
            const speed = parseFloat(document.getElementById('speedSlider').value);
            
            // Warning if timer is running
            if (currentState.mode === 'running') {
                if (!confirm(`⚠️ Timer is currently running.\n\nApplying speed change (${speed.toFixed(2)}x) will affect the timer immediately.\n\nContinue?`)) {
                    return;
                }
            }

            // Stop animation
            if (speedAnimationInterval) {
                clearInterval(speedAnimationInterval);
                speedAnimationInterval = null;
            }

            // Apply speed to hidden input for compatibility
            if (!document.getElementById('speed')) {
                const hiddenSpeed = document.createElement('input');
                hiddenSpeed.type = 'hidden';
                hiddenSpeed.id = 'speed';
                document.body.appendChild(hiddenSpeed);
            }
            document.getElementById('speed').value = speed;

            saveSettings();
            emitSettings();
            
            // Visual feedback
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '✅ Applied!';
            btn.style.background = '#388e3c';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '#4caf50';
            }, 2000);
        }

        // Emit live settings to server when inputs change
        function emitSettings() {
            const mode = currentTimerMode;
            const speedInput = document.getElementById('speed');
            const speedValue = speedInput ? parseFloat(speedInput.value) : parseFloat(document.getElementById('speedSlider').value);
            const payload = {
                durationMs: getDurationMs(),
                speed: speedValue || 1.0,
                amberThresholdMs: getAmberThresholdMs(),
                redThresholdMs: getRedThresholdMs(),
                countUp: document.getElementById('countUp').checked
            };
            if (mode === 'endAt') {
                payload.endAtTarget = document.getElementById('endAtTime').value;
                // Compute and include duration from local clock
                const now = new Date();
                const end = new Date(now);
                const [h, m] = (payload.endAtTarget || '00:00').split(':');
                end.setHours(parseInt(h||'0'), parseInt(m||'0'), 0, 0);
                if (end <= now) {
                    end.setDate(end.getDate() + 1);
                }
                payload.durationMs = Math.max(0, end.getTime() - now.getTime());
            }
            socket.emit('updateSettings', payload);
        }

        // Load saved settings from localStorage
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('timerSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                // Handle both old format (separate min/sec) and new format (MM:SS)
                if (settings.duration) {
                    document.getElementById('duration').value = settings.duration;
                } else {
                    const dMin = settings.durationMin ?? 30;
                    const dSec = settings.durationSec ?? 0;
                    document.getElementById('duration').value = formatTimeInput(dMin, dSec);
                }
                if (settings.amberThreshold) {
                    document.getElementById('amberThreshold').value = settings.amberThreshold;
                } else {
                    const aMin = settings.amberMin ?? 5;
                    const aSec = settings.amberSec ?? 0;
                    document.getElementById('amberThreshold').value = formatTimeInput(aMin, aSec);
                }
                if (settings.redThreshold) {
                    document.getElementById('redThreshold').value = settings.redThreshold;
                } else {
                    const rMin = settings.redMin ?? 2;
                    const rSec = settings.redSec ?? 0;
                    document.getElementById('redThreshold').value = formatTimeInput(rMin, rSec);
                }
                const speedValue = settings.speed || 1.0;
                document.getElementById('speedSlider').value = speedValue;
                if (document.getElementById('speed')) {
                    document.getElementById('speed').value = speedValue;
                }
                updateSpeedPreview();
                document.getElementById('countUp').checked = settings.countUp || false;
            } else {
                // Set sensible defaults on first load
                document.getElementById('duration').value = '30:00';
                document.getElementById('amberThreshold').value = '5:00';
                document.getElementById('redThreshold').value = '2:00';
                document.getElementById('speedSlider').value = 1.0;
                updateSpeedPreview();
            }
            // Send initial settings to server so thresholds match immediately
            emitSettings();
            // Render presets grid
            renderPresets();
            // Initialize output mode buttons state
            setOutputMode('timer');
            // Initialize end time display
            updateEndTimeCalc();
        });

        // Update end time display every second to keep it current
        setInterval(() => {
            updateEndTimeCalc();
            // Also update speed preview if visible
            if (document.getElementById('speedSlider')) {
                const durationMs = getDurationMs();
                const speed = parseFloat(document.getElementById('speedSlider').value);
                const realTimeMs = durationMs / speed;
                const now = new Date();
                const endTime = new Date(now.getTime() + realTimeMs);
                const hours = endTime.getHours().toString().padStart(2, '0');
                const minutes = endTime.getMinutes().toString().padStart(2, '0');
                const seconds = endTime.getSeconds().toString().padStart(2, '0');
                document.getElementById('speedEndTime').textContent = `${hours}:${minutes}:${seconds}`;
            }
        }, 1000);

        // Save settings to localStorage
        function saveSettings() {
            const settings = {
                duration: document.getElementById('duration').value,
                amberThreshold: document.getElementById('amberThreshold').value,
                redThreshold: document.getElementById('redThreshold').value,
                speed: document.getElementById('speedSlider').value,
                countUp: document.getElementById('countUp').checked
            };
            localStorage.setItem('timerSettings', JSON.stringify(settings));
        }

        // Auto-save settings when changed and emit live to server
        document.querySelectorAll('input').forEach(input => {
            // Skip speedSlider - it has its own apply button
            if (input.id === 'speedSlider') return;
            
            input.addEventListener('change', () => {
                saveSettings();
                emitSettings();
            });
            input.addEventListener('input', () => {
                saveSettings();
                emitSettings();
            });
        });

        // Speed slider only updates preview, doesn't auto-apply
        document.getElementById('speedSlider').addEventListener('input', updateSpeedPreview);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e)=>{
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
            if (e.code === 'Space') { e.preventDefault();
                if (currentState.mode === 'running') pauseTimer(); else if (currentState.mode==='paused') resumeTimer(); else startTimer();
            }
            if (e.key.toLowerCase() === 'r') { e.preventDefault(); resetTimer(); }
            if (e.key === '+' || e.key === '=') { e.preventDefault(); nudge(e.shiftKey? 5*60*1000 : 60*1000); }
            if (e.key === '-' || e.key === '_') { e.preventDefault(); nudge(e.shiftKey? -5*60*1000 : -60*1000); }
        });
    </script>
</body>
</html>
