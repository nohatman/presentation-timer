<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Foxy's Presentation Timer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 420px;
            width: 90%;
            padding: 2.5rem;
            background: rgba(26, 26, 26, 0.9);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a2a2a;
            box-sizing: border-box;
        }
        h1 {
            color: #fafafa;
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #cfcfcf;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 1rem;
            background: #101010;
            color: #e5e5e5;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #90caf9;
        }
        .button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            background: #2e7d32;
            color: white;
        }
        .button:hover:not(:disabled) {
            background: #256628;
        }
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #f1aeb5;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            display: none;
        }
        /* Calmer, non-alarming tone for a known account/organisation status,
           distinct from .error's red "you made a mistake" styling. */
        .notice {
            color: #ffcc80;
            background: rgba(255, 152, 0, 0.12);
            border: 1px solid rgba(255, 152, 0, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            display: none;
        }
        .notice strong {
            display: block;
            margin-bottom: 2px;
        }
        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Sign In</h1>
        <p class="subtitle">Foxy's Presentation Timer - Master Dashboard</p>

        <div class="notice" id="noticeMessage"></div>
        <div class="error" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="button" id="submitBtn">Sign In</button>
        </form>

        <p class="footer-note">Accounts are provisioned by BizShows. Contact support if you don't have credentials.</p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('errorMessage');
        const noticeEl = document.getElementById('noticeMessage');
        const submitBtn = document.getElementById('submitBtn');

        const PAUSED_ACCESS_TITLE = 'Access currently paused';
        const PAUSED_ACCESS_BODY = "Your organisation's access is currently paused. Please contact your administrator for assistance.";

        function showError(message) {
            noticeEl.style.display = 'none';
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function showPausedNotice() {
            errorEl.style.display = 'none';
            noticeEl.innerHTML = `<strong>${PAUSED_ACCESS_TITLE}</strong>${PAUSED_ACCESS_BODY}`;
            noticeEl.style.display = 'block';
        }

        // Reached when an already-logged-in session gets signed out because its
        // access was paused mid-session (authFetch on the dashboard/admin pages
        // redirects here with this reason instead of a bare, unexplained /login).
        if (new URLSearchParams(window.location.search).get('reason') === 'account_suspended') {
            showPausedNotice();
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorEl.style.display = 'none';
            noticeEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                if (response.status === 429) {
                    showError('Too many attempts. Please wait a few minutes and try again.');
                    return;
                }

                const data = await response.json();
                if (!data.ok) {
                    // Only ever set once the password has already verified correct
                    // (see db.verifyUserPassword) - never a way to tell whether an
                    // arbitrary email/password pair belongs to a real account.
                    if (data.reason === 'account_suspended') {
                        showPausedNotice();
                    } else {
                        showError(data.error || 'Invalid email or password');
                    }
                    return;
                }

                window.location.href = data.mustChangePassword ? '/change-password' : '/dashboard';
            } catch (err) {
                showError('Could not reach the server. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
