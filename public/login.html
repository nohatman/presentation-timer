<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Foxy Timer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/foxy.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 420px;
            width: 90%;
            padding: 2.5rem;
            background: var(--panel);
            border-radius: var(--radius);
            box-shadow: inset 0 1px 0 var(--bevel), 0 12px 36px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--seam);
            box-sizing: border-box;
        }
        h1 {
            color: var(--ink);
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: var(--ink-2);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--ink);
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid var(--edge);
            border-radius: var(--radius);
            font: inherit;
            font-size: 1rem;
            background: var(--well);
            color: var(--ink);
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--info);
        }
        .button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 24px;
            border: 1px solid var(--seam);
            border-radius: var(--radius);
            font: inherit;
            font-size: 1.05rem;
            cursor: pointer;
            font-weight: 600;
            background: var(--lit);
            color: #121314;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), inset 0 -2px 0 rgba(0, 0, 0, 0.25);
        }
        .button:hover:not(:disabled) {
            background: #e9eaec;
        }
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #f1aeb5;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            display: none;
        }
        /* Calmer, non-alarming tone for a known account/organisation status,
           distinct from .error's red "you made a mistake" styling. */
        .notice {
            color: #ffcc80;
            background: rgba(255, 152, 0, 0.12);
            border: 1px solid rgba(255, 152, 0, 0.3);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            display: none;
        }
        .notice strong {
            display: block;
            margin-bottom: 2px;
        }
        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--ink-2);
        }
    </style>
</head>
<body class="foxy">
    <div class="container">
        <h1 style="display:flex;align-items:center;justify-content:center;gap:10px;"><img src="/favicon.svg" alt="" width="30" height="30">Log in</h1>
        <p class="subtitle">Foxy Timer Online</p>

        <div class="notice" id="noticeMessage"></div>
        <div class="error" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="button" id="submitBtn">Log in</button>
        </form>

        <p class="footer-note">No account yet? <a href="/#contact">Ask for one</a>, or <a href="/try">try a demo room</a> with no sign-up.</p>
    </div>

    <script>
        // Foxy Timer for Windows keeps its own rooms and has no accounts: the
        // dashboard opens without a login on the laptop itself, and Foxy Timer
        // Online logins don't exist here. Say so instead of a login that can't work.
        fetch('/api/health').then(r => r.json()).then(h => {
            if (!h || h.mode !== 'local') return;
            document.getElementById('loginForm').style.display = 'none';
            document.querySelector('.subtitle').textContent = 'Foxy Timer for Windows';
            const note = document.getElementById('noticeMessage');
            note.innerHTML = '<b>No sign-in needed on this version.</b><br>The dashboard opens on the show laptop itself: '
                + 'click the Foxy Timer icon there, or open <b>http://localhost:' + (h.port || 3000) + '/dashboard</b> on it.<br><br>'
                + 'Phones and screens use the Control and Display links from the dashboard. '
                + 'Your foxytimer.com (Foxy Timer Online) login doesn’t apply here.';
            note.style.display = 'block';
            document.querySelector('.footer-note').innerHTML = '<a href="/help#connect" style="color:#90caf9;">Help: connecting devices</a>';
        }).catch(() => {});

        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('errorMessage');
        const noticeEl = document.getElementById('noticeMessage');
        const submitBtn = document.getElementById('submitBtn');

        const PAUSED_ACCESS_TITLE = 'Access currently paused';
        const PAUSED_ACCESS_BODY = "Your organisation’s access to the app is currently paused. Your rooms and settings remain safely stored. Please contact Business Shows for assistance. Once access has been restored, you can log in again as normal.";

        function showError(message) {
            noticeEl.style.display = 'none';
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function showPausedNotice() {
            errorEl.style.display = 'none';
            noticeEl.innerHTML = `<strong>${PAUSED_ACCESS_TITLE}</strong>${PAUSED_ACCESS_BODY}`;
            noticeEl.style.display = 'block';
        }

        // Reached when an already-logged-in session gets signed out because its
        // access was paused mid-session (authFetch on the dashboard/admin pages
        // redirects here with this reason instead of a bare, unexplained /login).
        if (new URLSearchParams(window.location.search).get('reason') === 'account_suspended') {
            showPausedNotice();
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorEl.style.display = 'none';
            noticeEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in…';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                if (response.status === 429) {
                    showError('Too many attempts. Please wait a few minutes and try again.');
                    return;
                }

                const data = await response.json();
                if (!data.ok) {
                    // Only ever set once the password has already verified correct
                    // (see db.verifyUserPassword) - never a way to tell whether an
                    // arbitrary email/password pair belongs to a real account.
                    if (data.reason === 'account_suspended') {
                        showPausedNotice();
                    } else {
                        showError(data.error || 'Invalid email or password');
                    }
                    return;
                }

                window.location.href = data.mustChangePassword ? '/change-password' : '/dashboard';
            } catch (err) {
                showError('Could not reach the server. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log in';
            }
        });
    </script>
</body>
</html>
