<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxy's Presentation Timer - Client Detail</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            font-size: 1.7rem;
            color: #fafafa;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .nav-link {
            padding: 10px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a1a;
            color: #e5e5e5;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .nav-link:hover {
            background: #252525;
            border-color: #4caf50;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-badge.active {
            background: #2e7d32;
            color: white;
        }
        .status-badge.suspended {
            background: #b71c1c;
            color: white;
        }
        .section {
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .section h2 {
            font-size: 1.1rem;
            color: #f5f5f5;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #333;
        }
        .profile-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .profile-item {
            min-width: 140px;
        }
        .profile-label {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        .profile-value {
            font-size: 1rem;
            font-weight: 600;
            color: #e5e5e5;
        }
        .data-table {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .data-row {
            display: grid;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: #0a0a0a;
            border-radius: 8px;
            align-items: center;
        }
        .data-row.header-row {
            color: #999;
            font-size: 0.72rem;
            text-transform: uppercase;
            font-weight: 700;
            background: transparent;
            padding: 0 1rem;
            letter-spacing: 0.5px;
        }
        .users-row { grid-template-columns: 2fr 1fr 1fr 1.2fr; }
        .rooms-row { grid-template-columns: 2fr 1.5fr 1fr 1.2fr; }
        .event-group {
            margin-bottom: 1rem;
        }
        .event-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ccc;
            margin: 1rem 0 0.5rem;
        }
        .event-name:first-child {
            margin-top: 0;
        }
        .empty-hint {
            color: #666;
            padding: 1rem;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #999;
        }
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }
            .header {
                padding: 1.1rem;
                margin-bottom: 1rem;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .section {
                padding: 1rem;
            }
            .data-row.header-row {
                display: none;
            }
            .users-row, .rooms-row {
                grid-template-columns: 1fr;
                gap: 0.25rem;
            }
            .data-row:not(.header-row) [data-label]::before {
                content: attr(data-label) ": ";
                color: #999;
                font-weight: 600;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1 id="clientTitle">Loading…</h1>
            <p style="color: #999; margin-top: 0.5rem;" id="clientSubtitle"></p>
        </div>
        <div class="nav-links">
            <a href="/admin/clients" class="nav-link">← Back to Clients</a>
            <a href="/dashboard" class="nav-link">🏠 Dashboard</a>
            <button onclick="logout()" class="nav-link" style="cursor:pointer;">🚪 Logout</button>
        </div>
    </div>

    <div id="content">
        <div class="loading">Loading client…</div>
    </div>

    <script>
        // Same authFetch pattern as dashboard.html / admin-clients.html.
        async function authFetch(url, options = {}) {
            const response = await fetch(url, options);

            if (response.status === 401) {
                window.location.href = '/login';
                return response;
            }

            if (response.status === 403) {
                const data = await response.clone().json().catch(() => null);
                if (data && data.mustChangePassword) {
                    window.location.href = '/change-password';
                } else {
                    window.location.href = '/dashboard';
                }
                return response;
            }

            return response;
        }

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (err) {
                console.error('Error logging out:', err);
            }
            window.location.href = '/login';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function formatDate(ms) {
            if (!ms) return '—';
            return new Date(ms).toLocaleString();
        }

        // /admin/clients/:id -> id is the last path segment.
        const clientId = window.location.pathname.split('/').filter(Boolean).pop();

        async function fetchClientDetail() {
            const content = document.getElementById('content');
            try {
                const response = await authFetch(`/api/admin/clients/${encodeURIComponent(clientId)}`);
                if (!response.ok) {
                    if (response.status === 404) {
                        content.innerHTML = `<div class="empty-hint">Client not found.</div>`;
                    }
                    return;
                }
                const data = await response.json();
                if (!data.ok) return;

                renderClient(data.client, data.users, data.events, data.rooms);
            } catch (error) {
                console.error('Error fetching client detail:', error);
                content.innerHTML = `<div class="empty-hint">Failed to load client.</div>`;
            }
        }

        function renderClient(client, users, events, rooms) {
            const statusClass = client.status === 'active' ? 'active' : 'suspended';
            document.getElementById('clientTitle').innerHTML = `
                🏢 ${escapeHtml(client.name)}
                <span class="status-badge ${statusClass}">${escapeHtml(client.status)}</span>
                ${client.is_platform_admin ? '<span class="status-badge" style="background:#6a1b9a;">PLATFORM ADMIN</span>' : ''}
            `;
            document.getElementById('clientSubtitle').textContent = `Client since ${formatDate(client.created_at)}`;

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="section">
                    <h2>Profile</h2>
                    <div class="profile-grid">
                        <div class="profile-item">
                            <div class="profile-label">Client ID</div>
                            <div class="profile-value">${client.id}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Status</div>
                            <div class="profile-value">${escapeHtml(client.status)}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Users</div>
                            <div class="profile-value">${users.length}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Events</div>
                            <div class="profile-value">${events.length}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Rooms</div>
                            <div class="profile-value">${rooms.length}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Licence / plan</div>
                            <div class="profile-value" style="color:#666;">Not configured</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>Users (${users.length})</h2>
                    ${renderUsersTable(users)}
                </div>

                <div class="section">
                    <h2>Events &amp; Rooms</h2>
                    ${renderEventsAndRooms(events, rooms)}
                </div>
            `;
        }

        function renderUsersTable(users) {
            if (users.length === 0) {
                return `<div class="empty-hint">No users yet.</div>`;
            }
            return `
                <div class="data-table">
                    <div class="data-row header-row users-row">
                        <div>Email</div>
                        <div>Status</div>
                        <div>Must change password</div>
                        <div>Created</div>
                    </div>
                    ${users.map(user => `
                        <div class="data-row users-row">
                            <div data-label="Email">${escapeHtml(user.email)}</div>
                            <div data-label="Status">${escapeHtml(user.status)}</div>
                            <div data-label="Must change password">${user.must_change_password ? 'Yes' : 'No'}</div>
                            <div data-label="Created">${formatDate(user.created_at)}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderEventsAndRooms(events, rooms) {
            if (events.length === 0) {
                return `<div class="empty-hint">No events yet.</div>`;
            }

            return events.map(event => {
                const eventRooms = rooms.filter(r => r.event_id === event.id);
                return `
                    <div class="event-group">
                        <div class="event-name">📅 ${escapeHtml(event.name)} (${eventRooms.length} room${eventRooms.length === 1 ? '' : 's'})</div>
                        ${eventRooms.length === 0 ? '<div class="empty-hint">No rooms in this event.</div>' : `
                            <div class="data-table">
                                <div class="data-row header-row rooms-row">
                                    <div>Slug</div>
                                    <div>Hidden</div>
                                    <div>Created</div>
                                    <div>Updated</div>
                                </div>
                                ${eventRooms.map(room => `
                                    <div class="data-row rooms-row">
                                        <div data-label="Slug">${escapeHtml(room.slug)}</div>
                                        <div data-label="Hidden">${room.hidden ? 'Yes' : 'No'}</div>
                                        <div data-label="Created">${formatDate(room.created_at)}</div>
                                        <div data-label="Updated">${formatDate(room.updated_at)}</div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        fetchClientDetail();
    </script>
</body>
</html>
