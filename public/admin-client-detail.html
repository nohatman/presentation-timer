<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxy's Presentation Timer - Client Detail</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            font-size: 1.7rem;
            color: #fafafa;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .nav-link {
            padding: 10px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a1a;
            color: #e5e5e5;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .nav-link:hover {
            background: #252525;
            border-color: #4caf50;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-badge.active {
            background: #2e7d32;
            color: white;
        }
        .status-badge.suspended {
            background: #b71c1c;
            color: white;
        }
        .section {
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .section h2 {
            font-size: 1.1rem;
            color: #f5f5f5;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #333;
        }
        .profile-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .profile-item {
            min-width: 140px;
        }
        .profile-label {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        .profile-value {
            font-size: 1rem;
            font-weight: 600;
            color: #e5e5e5;
        }
        .data-table {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .data-row {
            display: grid;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: #0a0a0a;
            border-radius: 8px;
            align-items: center;
        }
        .data-row.header-row {
            color: #999;
            font-size: 0.72rem;
            text-transform: uppercase;
            font-weight: 700;
            background: transparent;
            padding: 0 1rem;
            letter-spacing: 0.5px;
        }
        .users-row { grid-template-columns: 2fr 1fr 1fr 1.2fr 1.8fr; }
        .rooms-row { grid-template-columns: 2fr 1.5fr 1fr 1.2fr; }
        .event-group {
            margin-bottom: 1rem;
        }
        .event-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ccc;
            margin: 1rem 0 0.5rem;
        }
        .event-name:first-child {
            margin-top: 0;
        }
        .empty-hint {
            color: #666;
            padding: 1rem;
            text-align: center;
        }
        .section-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #333;
        }
        .section-header-row h2 {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .mini-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #ccc;
            font-size: 0.78rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .mini-btn:hover {
            border-color: #4caf50;
            color: #fff;
        }
        .row-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #999;
        }
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }
            .header {
                padding: 1.1rem;
                margin-bottom: 1rem;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .section {
                padding: 1rem;
            }
            .data-row.header-row {
                display: none;
            }
            .users-row, .rooms-row {
                grid-template-columns: 1fr;
                gap: 0.25rem;
            }
            .data-row:not(.header-row) [data-label]::before {
                content: attr(data-label) ": ";
                color: #999;
                font-weight: 600;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1 id="clientTitle">Loading…</h1>
            <p style="color: #999; margin-top: 0.5rem;" id="clientSubtitle"></p>
        </div>
        <div class="nav-links">
            <a href="/admin/clients" class="nav-link">← Back to Clients</a>
            <a href="/dashboard" class="nav-link">🏠 Dashboard</a>
            <button onclick="logout()" class="nav-link" style="cursor:pointer;">🚪 Logout</button>
        </div>
    </div>

    <div id="content">
        <div class="loading">Loading client…</div>
    </div>

    <!-- Generic modal shell (Phase 6c.2) - same pattern as admin-clients.html
         and control.html's Take Over modal: custom overlay, not
         window.confirm()/alert()/prompt(), focus moves into the dialog on
         open and back to the trigger element on close, Escape and
         click-outside both close safely. -->
    <div id="modalOverlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;" onclick="if (event.target === this) closeModal();">
        <div id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1" style="background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 24px; max-width: 440px; width: 100%; box-sizing: border-box; box-shadow: 0 8px 32px rgba(0,0,0,0.5); outline: none;">
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // Same authFetch pattern as dashboard.html / admin-clients.html.
        async function authFetch(url, options = {}) {
            const response = await fetch(url, options);

            if (response.status === 401) {
                window.location.href = '/login';
                return response;
            }

            if (response.status === 403) {
                const data = await response.clone().json().catch(() => null);
                if (data && data.mustChangePassword) {
                    window.location.href = '/change-password';
                } else {
                    window.location.href = '/dashboard';
                }
                return response;
            }

            return response;
        }

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (err) {
                console.error('Error logging out:', err);
            }
            window.location.href = '/login';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function formatDate(ms) {
            if (!ms) return '—';
            return new Date(ms).toLocaleString();
        }

        // API-key metadata columns are nullable for clients that predate them
        // (Phase 6c.3) - "Not recorded" is an honest gap, not an invented date,
        // distinct from formatDate()'s '—' used elsewhere for fields that are
        // always populated.
        function formatApiKeyDate(ms) {
            return ms ? new Date(ms).toLocaleString() : 'Not recorded';
        }

        // /admin/clients/:id -> id is the last path segment.
        const clientId = window.location.pathname.split('/').filter(Boolean).pop();

        async function fetchClientDetail() {
            const content = document.getElementById('content');
            try {
                const response = await authFetch(`/api/admin/clients/${encodeURIComponent(clientId)}`);
                if (!response.ok) {
                    if (response.status === 404) {
                        content.innerHTML = `<div class="empty-hint">Client not found.</div>`;
                    }
                    return;
                }
                const data = await response.json();
                if (!data.ok) return;

                renderClient(data.client, data.users, data.events, data.rooms);
            } catch (error) {
                console.error('Error fetching client detail:', error);
                content.innerHTML = `<div class="empty-hint">Failed to load client.</div>`;
            }
        }

        let currentClientName = '';
        let currentUsers = [];

        function renderClient(client, users, events, rooms) {
            currentClientName = client.name;
            currentUsers = users;
            const statusClass = client.status === 'active' ? 'active' : 'suspended';
            document.getElementById('clientTitle').innerHTML = `
                🏢 ${escapeHtml(client.name)}
                <span class="status-badge ${statusClass}">${escapeHtml(client.status)}</span>
                ${client.is_platform_admin ? '<span class="status-badge" style="background:#6a1b9a;">PLATFORM ADMIN</span>' : ''}
                <button id="editNameBtn" onclick="openEditNameModal(this)" class="mini-btn">✏️ Edit name</button>
                ${client.status === 'active'
                    ? `<button id="suspendBtn" onclick="openSuspendConfirm(this)" class="mini-btn" style="border-color:#b71c1c;color:#ff8a80;">⏸ Suspend</button>`
                    : `<button id="reactivateBtn" onclick="submitReactivate(this)" class="mini-btn" style="border-color:#2e7d32;color:#81c784;">▶ Reactivate</button>`}
            `;
            document.getElementById('clientSubtitle').textContent = `Client since ${formatDate(client.created_at)}`;

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="section">
                    <h2>Profile</h2>
                    <div class="profile-grid">
                        <div class="profile-item">
                            <div class="profile-label">Client ID</div>
                            <div class="profile-value">${client.id}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Status</div>
                            <div class="profile-value">${escapeHtml(client.status)}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Users</div>
                            <div class="profile-value">${users.length}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Events</div>
                            <div class="profile-value">${events.length}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Rooms</div>
                            <div class="profile-value">${rooms.length}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Licence / plan</div>
                            <div class="profile-value" style="color:#666;">Not configured</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header-row">
                        <h2>API Key</h2>
                        <button id="rotateKeyBtn" onclick="openRotateKeyConfirm(this)" class="mini-btn">🔄 Rotate API Key</button>
                    </div>
                    <p style="margin:0 0 1rem 0;color:#999;font-size:0.85rem;">Used by Companion and other API integrations - not for human dashboard login. The key itself is never shown again after creation or rotation.</p>
                    <div class="profile-grid">
                        <div class="profile-item">
                            <div class="profile-label">Key created</div>
                            <div class="profile-value">${formatApiKeyDate(client.api_key_created_at)}</div>
                        </div>
                        <div class="profile-item">
                            <div class="profile-label">Key last rotated</div>
                            <div class="profile-value">${formatApiKeyDate(client.api_key_rotated_at)}</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header-row">
                        <h2>Users (${users.length})</h2>
                        <button id="addUserBtn" onclick="openAddUserModal(this)" class="mini-btn" style="background:#2e7d32;border-color:#2e7d32;color:#fff;">➕ Add User</button>
                    </div>
                    ${renderUsersTable(users)}
                </div>

                <div class="section">
                    <h2>Events &amp; Rooms</h2>
                    ${renderEventsAndRooms(events, rooms)}
                </div>
            `;
        }

        function renderUsersTable(users) {
            if (users.length === 0) {
                return `<div class="empty-hint">No users yet.</div>`;
            }
            return `
                <div class="data-table">
                    <div class="data-row header-row users-row">
                        <div>Email</div>
                        <div>Status</div>
                        <div>Must change password</div>
                        <div>Created</div>
                        <div>Actions</div>
                    </div>
                    ${users.map(user => `
                        <div class="data-row users-row">
                            <div data-label="Email">${escapeHtml(user.email)}</div>
                            <div data-label="Status">${escapeHtml(user.status)}</div>
                            <div data-label="Must change password">${user.must_change_password ? 'Yes' : 'No'}</div>
                            <div data-label="Created">${formatDate(user.created_at)}</div>
                            <div data-label="Actions" class="row-actions">
                                <button onclick="openChangeEmailModal(this, ${user.id})" class="mini-btn">✉️ Email</button>
                                <button onclick="openResetPasswordConfirm(this, ${user.id})" class="mini-btn">🔑 Reset</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderEventsAndRooms(events, rooms) {
            if (events.length === 0) {
                return `<div class="empty-hint">No events yet.</div>`;
            }

            return events.map(event => {
                const eventRooms = rooms.filter(r => r.event_id === event.id);
                return `
                    <div class="event-group">
                        <div class="event-name">📅 ${escapeHtml(event.name)} (${eventRooms.length} room${eventRooms.length === 1 ? '' : 's'})</div>
                        ${eventRooms.length === 0 ? '<div class="empty-hint">No rooms in this event.</div>' : `
                            <div class="data-table">
                                <div class="data-row header-row rooms-row">
                                    <div>Slug</div>
                                    <div>Hidden</div>
                                    <div>Created</div>
                                    <div>Updated</div>
                                </div>
                                ${eventRooms.map(room => `
                                    <div class="data-row rooms-row">
                                        <div data-label="Slug">${escapeHtml(room.slug)}</div>
                                        <div data-label="Hidden">${room.hidden ? 'Yes' : 'No'}</div>
                                        <div data-label="Created">${formatDate(room.created_at)}</div>
                                        <div data-label="Updated">${formatDate(room.updated_at)}</div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // Generic modal machinery (Phase 6c.2) - see the HTML comment above
        // the #modalOverlay element for the design rationale. Duplicated from
        // admin-clients.html rather than shared, matching this codebase's
        // existing convention of no shared JS file between pages.
        // ============================================================
        let modalTriggerEl = null;

        function handleModalKeydown(e) {
            if (e.key === 'Escape') closeModal();
        }

        function openModal(html, triggerEl) {
            modalTriggerEl = triggerEl || null;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('modalBox').focus();
            document.addEventListener('keydown', handleModalKeydown);
        }

        // Clears modalContent's innerHTML on close, not just hides it - a
        // one-time secret (temp password) must not linger in the DOM after
        // the modal showing it has been dismissed.
        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalContent').innerHTML = '';
            document.removeEventListener('keydown', handleModalKeydown);
            if (modalTriggerEl) modalTriggerEl.focus();
            modalTriggerEl = null;
        }

        async function copyModalSecret(elementId, buttonEl) {
            const text = document.getElementById(elementId).textContent;
            try {
                await navigator.clipboard.writeText(text);
                const original = buttonEl.textContent;
                buttonEl.textContent = '✅ Copied';
                setTimeout(() => { buttonEl.textContent = original; }, 1500);
            } catch (error) {
                console.error('Copy failed:', error);
            }
        }

        function modalButtonRow(html) {
            return `<div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;">${html}</div>`;
        }
        const CANCEL_BTN_STYLE = 'padding:10px 18px;border-radius:8px;border:1px solid #444;background:transparent;color:#ccc;cursor:pointer;font-size:0.9rem;';
        const PRIMARY_BTN_STYLE = 'padding:10px 18px;border-radius:8px;border:none;background:#2e7d32;color:#fff;cursor:pointer;font-weight:600;font-size:0.9rem;';
        const DANGER_BTN_STYLE = 'padding:10px 18px;border-radius:8px;border:none;background:#b71c1c;color:#fff;cursor:pointer;font-weight:600;font-size:0.9rem;';

        function renderTempPasswordResult(titleContext, email, tempPassword, onDoneCall) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">${escapeHtml(titleContext)} — temporary password</h2>
                <p style="margin:0 0 8px 0;color:#ccc;font-size:0.9rem;">Email: <strong>${escapeHtml(email)}</strong></p>
                <div id="tempPasswordText" style="background:#0a0a0a;border:1px solid #333;border-radius:6px;padding:12px;margin:12px 0;font-family:'Courier New',monospace;font-size:0.85rem;word-break:break-all;user-select:all;">${escapeHtml(tempPassword)}</div>
                <p style="margin:0 0 20px 0;color:#f44336;font-size:0.82rem;">⚠ This password will not be shown again. Share it with the user via a secure channel - they must change it on first login.</p>
                <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                    <button onclick="copyModalSecret('tempPasswordText', this)" style="${CANCEL_BTN_STYLE}">📋 Copy</button>
                    <button onclick="${onDoneCall}" style="${PRIMARY_BTN_STYLE}">Done</button>
                </div>
            `;
        }

        function afterMutation() {
            closeModal();
            fetchClientDetail();
        }

        // ---- Edit client name ----

        function renderEditNameForm(errorMsg) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Edit client name</h2>
                ${errorMsg ? `<div style="background:#b71c1c;color:#fff;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:0.85rem;">${escapeHtml(errorMsg)}</div>` : ''}
                <label style="display:block;font-size:0.8rem;color:#999;margin-bottom:6px;">Client name</label>
                <input id="editNameInput" type="text" value="${escapeHtml(currentClientName)}" style="width:100%;padding:10px 12px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#e5e5e5;margin-bottom:20px;box-sizing:border-box;" onkeypress="if(event.key==='Enter') submitEditName()">
                ${modalButtonRow(`
                    <button onclick="closeModal()" style="${CANCEL_BTN_STYLE}">Cancel</button>
                    <button onclick="submitEditName()" style="${PRIMARY_BTN_STYLE}">Save</button>
                `)}
            `;
        }

        function openEditNameModal(triggerEl) {
            openModal(renderEditNameForm(), triggerEl);
            const input = document.getElementById('editNameInput');
            input.focus();
            input.select();
        }

        async function submitEditName() {
            const input = document.getElementById('editNameInput');
            const name = input.value.trim();
            if (!name) return;
            try {
                const response = await authFetch(`/api/admin/clients/${encodeURIComponent(clientId)}/rename`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    document.getElementById('modalContent').innerHTML = renderEditNameForm(data ? data.error : 'Failed to rename client.');
                    document.getElementById('editNameInput').focus();
                    return;
                }
                afterMutation();
            } catch (error) {
                console.error('Error renaming client:', error);
                document.getElementById('modalContent').innerHTML = renderEditNameForm('Failed to rename client. Please try again.');
            }
        }

        // ---- Add user ----

        function renderAddUserForm(errorMsg) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Add user to "${escapeHtml(currentClientName)}"</h2>
                <p style="margin:0 0 16px 0;color:#ccc;font-size:0.9rem;">They'll receive a one-time temporary password and must change it on first login.</p>
                ${errorMsg ? `<div style="background:#b71c1c;color:#fff;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:0.85rem;">${escapeHtml(errorMsg)}</div>` : ''}
                <label style="display:block;font-size:0.8rem;color:#999;margin-bottom:6px;">Email</label>
                <input id="addUserEmailInput" type="email" style="width:100%;padding:10px 12px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#e5e5e5;margin-bottom:20px;box-sizing:border-box;" placeholder="e.g. jamie@client.com" onkeypress="if(event.key==='Enter') submitAddUser()">
                ${modalButtonRow(`
                    <button onclick="closeModal()" style="${CANCEL_BTN_STYLE}">Cancel</button>
                    <button onclick="submitAddUser()" style="${PRIMARY_BTN_STYLE}">Create User</button>
                `)}
            `;
        }

        function openAddUserModal(triggerEl) {
            openModal(renderAddUserForm(), triggerEl);
            document.getElementById('addUserEmailInput').focus();
        }

        async function submitAddUser() {
            const input = document.getElementById('addUserEmailInput');
            const email = input.value.trim();
            if (!email) return;
            try {
                const response = await authFetch(`/api/admin/clients/${encodeURIComponent(clientId)}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    document.getElementById('modalContent').innerHTML = renderAddUserForm(data ? data.error : 'Failed to create user.');
                    document.getElementById('addUserEmailInput').focus();
                    return;
                }
                document.getElementById('modalContent').innerHTML = renderTempPasswordResult('User created', data.user.email, data.tempPassword, 'afterMutation()');
            } catch (error) {
                console.error('Error creating user:', error);
                document.getElementById('modalContent').innerHTML = renderAddUserForm('Failed to create user. Please try again.');
            }
        }

        // ---- Change user email ----

        let changeEmailUserId = null;

        function renderChangeEmailForm(currentEmail, errorMsg) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Change user email</h2>
                <p style="margin:0 0 16px 0;color:#ccc;font-size:0.9rem;">Current: <strong>${escapeHtml(currentEmail)}</strong>. Changing this will sign the user out of all active sessions.</p>
                ${errorMsg ? `<div style="background:#b71c1c;color:#fff;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:0.85rem;">${escapeHtml(errorMsg)}</div>` : ''}
                <label style="display:block;font-size:0.8rem;color:#999;margin-bottom:6px;">New email</label>
                <input id="changeEmailInput" type="email" style="width:100%;padding:10px 12px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#e5e5e5;margin-bottom:20px;box-sizing:border-box;" onkeypress="if(event.key==='Enter') submitChangeEmail()">
                ${modalButtonRow(`
                    <button onclick="closeModal()" style="${CANCEL_BTN_STYLE}">Cancel</button>
                    <button onclick="submitChangeEmail()" style="${PRIMARY_BTN_STYLE}">Save &amp; Sign Out Sessions</button>
                `)}
            `;
        }

        function openChangeEmailModal(triggerEl, userId) {
            const user = currentUsers.find(u => u.id === userId);
            if (!user) return;
            changeEmailUserId = userId;
            openModal(renderChangeEmailForm(user.email), triggerEl);
            document.getElementById('changeEmailInput').focus();
        }

        async function submitChangeEmail() {
            const input = document.getElementById('changeEmailInput');
            const newEmail = input.value.trim();
            if (!newEmail) return;
            const user = currentUsers.find(u => u.id === changeEmailUserId);
            try {
                const response = await authFetch(`/api/admin/users/${changeEmailUserId}/change-email`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newEmail })
                });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    document.getElementById('modalContent').innerHTML = renderChangeEmailForm(user ? user.email : '', data ? data.error : 'Failed to change email.');
                    document.getElementById('changeEmailInput').focus();
                    return;
                }
                afterMutation();
            } catch (error) {
                console.error('Error changing email:', error);
                document.getElementById('modalContent').innerHTML = renderChangeEmailForm(user ? user.email : '', 'Failed to change email. Please try again.');
            }
        }

        // ---- Reset password ----

        let resetPasswordUserId = null;

        function renderResetPasswordConfirm(email) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Reset password?</h2>
                <p style="margin:0 0 20px 0;color:#ccc;font-size:0.9rem;line-height:1.5;">Reset the password for <strong>${escapeHtml(email)}</strong>? This will sign them out of all devices immediately and they'll need to set a new password on next login.</p>
                ${modalButtonRow(`
                    <button onclick="closeModal()" style="${CANCEL_BTN_STYLE}">Cancel</button>
                    <button onclick="confirmResetPassword()" style="${DANGER_BTN_STYLE}">Reset Password</button>
                `)}
            `;
        }

        function openResetPasswordConfirm(triggerEl, userId) {
            const user = currentUsers.find(u => u.id === userId);
            if (!user) return;
            resetPasswordUserId = userId;
            openModal(renderResetPasswordConfirm(user.email), triggerEl);
        }

        async function confirmResetPassword() {
            const user = currentUsers.find(u => u.id === resetPasswordUserId);
            try {
                const response = await authFetch(`/api/admin/users/${resetPasswordUserId}/reset-password`, {
                    method: 'POST'
                });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    closeModal();
                    return;
                }
                document.getElementById('modalContent').innerHTML = renderTempPasswordResult('Password reset', data.user.email, data.tempPassword, 'afterMutation()');
            } catch (error) {
                console.error('Error resetting password:', error);
                closeModal();
            }
        }

        // ---- Suspend / reactivate (Phase 6c.3) ----

        function renderSuspendConfirm(clientName) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Suspend "${escapeHtml(clientName)}"?</h2>
                <p style="margin:0 0 20px 0;color:#ccc;font-size:0.9rem;line-height:1.5;">This immediately blocks all access for this client: dashboard sessions are signed out, API requests are rejected, and any connected control/display screens are disconnected. Nothing is deleted - no clients, users, events, rooms, or credentials. Reactivating restores access using the same login and API key, with nothing to regenerate.</p>
                ${modalButtonRow(`
                    <button onclick="closeModal()" style="${CANCEL_BTN_STYLE}">Cancel</button>
                    <button onclick="confirmSuspend()" style="${DANGER_BTN_STYLE}">Suspend Client</button>
                `)}
            `;
        }

        function openSuspendConfirm(triggerEl) {
            openModal(renderSuspendConfirm(currentClientName), triggerEl);
        }

        async function confirmSuspend() {
            try {
                const response = await authFetch(`/api/admin/clients/${encodeURIComponent(clientId)}/suspend`, { method: 'POST' });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    closeModal();
                    return;
                }
                afterMutation();
            } catch (error) {
                console.error('Error suspending client:', error);
                closeModal();
            }
        }

        async function submitReactivate(triggerEl) {
            triggerEl.disabled = true;
            try {
                const response = await authFetch(`/api/admin/clients/${encodeURIComponent(clientId)}/reactivate`, { method: 'POST' });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    triggerEl.disabled = false;
                    return;
                }
                fetchClientDetail();
            } catch (error) {
                console.error('Error reactivating client:', error);
                triggerEl.disabled = false;
            }
        }

        // ---- Rotate API key (Phase 6c.3) ----

        function renderRotateKeyConfirm(clientName) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Rotate API key for "${escapeHtml(clientName)}"?</h2>
                <p style="margin:0 0 20px 0;color:#ccc;font-size:0.9rem;line-height:1.5;">The current key stops working immediately. Any Companion connections or other integrations using it will need the new key.</p>
                ${modalButtonRow(`
                    <button onclick="closeModal()" style="${CANCEL_BTN_STYLE}">Cancel</button>
                    <button onclick="confirmRotateKey()" style="${DANGER_BTN_STYLE}">Rotate Key</button>
                `)}
            `;
        }

        function openRotateKeyConfirm(triggerEl) {
            openModal(renderRotateKeyConfirm(currentClientName), triggerEl);
        }

        async function confirmRotateKey() {
            try {
                const response = await authFetch(`/api/admin/clients/${encodeURIComponent(clientId)}/rotate-key`, { method: 'POST' });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    closeModal();
                    return;
                }
                document.getElementById('modalContent').innerHTML = renderApiKeyRotatedResult(data.client.name, data.apiKey);
            } catch (error) {
                console.error('Error rotating API key:', error);
                closeModal();
            }
        }

        function renderApiKeyRotatedResult(clientName, apiKey) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">API key rotated</h2>
                <p style="margin:0 0 8px 0;color:#ccc;font-size:0.9rem;">New key for <strong>${escapeHtml(clientName)}</strong>:</p>
                <div id="apiKeyText" style="background:#0a0a0a;border:1px solid #333;border-radius:6px;padding:12px;margin:12px 0;font-family:'Courier New',monospace;font-size:0.85rem;word-break:break-all;user-select:all;">${escapeHtml(apiKey)}</div>
                <p style="margin:0 0 20px 0;color:#ccc;font-size:0.82rem;">For security, this key cannot be viewed again. If it is lost, generate a replacement with Rotate API Key.</p>
                <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                    <button onclick="copyModalSecret('apiKeyText', this)" style="${CANCEL_BTN_STYLE}">📋 Copy</button>
                    <button onclick="afterMutation()" style="${PRIMARY_BTN_STYLE}">Done</button>
                </div>
            `;
        }

        fetchClientDetail();
    </script>
</body>
</html>
