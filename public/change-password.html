<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password - Foxy Timer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/foxy.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 440px;
            width: 90%;
            padding: 2.5rem;
            background: var(--panel);
            border-radius: var(--radius);
            box-shadow: inset 0 1px 0 var(--bevel), 0 12px 36px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--seam);
            box-sizing: border-box;
        }
        h1 {
            color: var(--ink);
            margin: 0 0 0.5rem 0;
            font-size: 1.6rem;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: var(--ink-2);
            margin-bottom: 2rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--ink);
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid var(--edge);
            border-radius: var(--radius);
            font: inherit;
            font-size: 1rem;
            background: var(--well);
            color: var(--ink);
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--info);
        }
        .hint {
            font-size: 0.8rem;
            color: var(--ink-2);
            margin-top: 4px;
        }
        .button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 24px;
            border: 1px solid var(--seam);
            border-radius: var(--radius);
            font: inherit;
            font-size: 1.05rem;
            cursor: pointer;
            font-weight: 600;
            background: var(--lit);
            color: #121314;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), inset 0 -2px 0 rgba(0, 0, 0, 0.25);
        }
        .button:hover:not(:disabled) {
            background: #e9eaec;
        }
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #f1aeb5;
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            display: none;
        }
    </style>
</head>
<body class="foxy">
    <div class="container">
        <h1>Choose a new password</h1>
        <p class="subtitle">Your account was created with a temporary password. Choose a new one before continuing to the dashboard.</p>

        <div class="error" id="errorMessage"></div>

        <form id="changeForm">
            <div class="form-group">
                <label for="currentPassword">Current (temporary) password</label>
                <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required minlength="10">
                <div class="hint">At least 10 characters.</div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required minlength="10">
            </div>
            <button type="submit" class="button" id="submitBtn">Change password</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('changeForm');
        const errorEl = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorEl.style.display = 'none';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (newPassword !== confirmPassword) {
                showError('New password and confirmation do not match.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Changing password…';

            try {
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        currentPassword: document.getElementById('currentPassword').value,
                        newPassword,
                        confirmPassword
                    })
                });

                const data = await response.json();

                if (response.status === 401) {
                    // No valid session at all - not just "must change password" (that's
                    // the normal reason for being on this page in the first place) -
                    // OR access is currently paused, flagged via reason.
                    window.location.href = (data && data.reason === 'account_suspended') ? '/login?reason=account_suspended' : '/login';
                    return;
                }

                if (!data.ok) {
                    showError(data.error || 'Could not change password');
                    return;
                }

                window.location.href = '/dashboard';
            } catch (err) {
                showError('Could not reach the server. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Change password';
            }
        });
    </script>
</body>
</html>
