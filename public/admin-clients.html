<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxy's Presentation Timer - Client Management</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            font-size: 2rem;
            color: #fafafa;
        }
        .badge-platform-admin {
            font-size: 0.8rem;
            font-weight: 700;
            background: #6a1b9a;
            color: white;
            padding: 3px 10px;
            border-radius: 5px;
            vertical-align: middle;
            margin-left: 8px;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .nav-link {
            padding: 10px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a1a;
            color: #e5e5e5;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .nav-link:hover {
            background: #252525;
            border-color: #4caf50;
        }
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .client-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: border-color 0.2s, transform 0.2s;
        }
        .client-card:hover {
            border-color: #4caf50;
            transform: translateY(-2px);
        }
        .client-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333;
        }
        .client-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f5f5f5;
            word-break: break-word;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .status-badge.active {
            background: #2e7d32;
            color: white;
        }
        .status-badge.suspended {
            background: #b71c1c;
            color: white;
        }
        .client-counts {
            display: flex;
            justify-content: space-around;
            gap: 0.5rem;
        }
        .count-item {
            text-align: center;
        }
        .count-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4caf50;
        }
        .count-label {
            font-size: 0.7rem;
            color: #999;
            text-transform: uppercase;
        }
        .empty-state, .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }
            .header {
                padding: 1.1rem;
                margin-bottom: 1rem;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .clients-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🏢 Client Management
                <span class="badge-platform-admin">PLATFORM ADMIN</span>
            </h1>
            <p style="color: #999; margin-top: 0.5rem;">All clients on this platform</p>
        </div>
        <div class="nav-links">
            <button id="createClientBtn" onclick="openCreateClientWizard(this)" class="nav-link" style="cursor:pointer;background:#2e7d32;border-color:#2e7d32;color:white;">➕ Create Client</button>
            <a href="/dashboard" class="nav-link">← Back to Dashboard</a>
            <button onclick="logout()" class="nav-link" style="cursor:pointer;">🚪 Logout</button>
        </div>
    </div>

    <div id="clientsContainer">
        <div class="loading">Loading clients...</div>
    </div>

    <!-- Generic modal shell (Phase 6c.2), reused for the guided Create Client
         wizard. Same pattern as control.html's Take Over modal - deliberately
         not window.confirm()/alert()/prompt(): custom overlay, focus moves
         into the dialog on open and back to the trigger element on close,
         Escape and click-outside both close safely. Content is swapped per
         step by the wizard functions below. -->
    <div id="modalOverlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;" onclick="if (event.target === this) closeModal();">
        <div id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1" style="background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 24px; max-width: 440px; width: 100%; box-sizing: border-box; box-shadow: 0 8px 32px rgba(0,0,0,0.5); outline: none;">
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // Same authFetch pattern as dashboard.html: 401 -> /login. A 403 here
        // means either "password change required" (mustChangePassword) or "not
        // a platform admin" - the latter shouldn't be reachable at all since the
        // page route itself already redirects non-admins to /dashboard, but the
        // API is independently gated regardless, so handle it defensively too.
        async function authFetch(url, options = {}) {
            const response = await fetch(url, options);

            if (response.status === 401) {
                window.location.href = '/login';
                return response;
            }

            if (response.status === 403) {
                const data = await response.clone().json().catch(() => null);
                if (data && data.mustChangePassword) {
                    window.location.href = '/change-password';
                } else {
                    window.location.href = '/dashboard';
                }
                return response;
            }

            return response;
        }

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (err) {
                console.error('Error logging out:', err);
            }
            window.location.href = '/login';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function fetchClients() {
            const container = document.getElementById('clientsContainer');
            try {
                const response = await authFetch('/api/admin/clients');
                if (!response.ok) return;
                const data = await response.json();
                if (!data.ok) return;

                if (data.clients.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div>No clients yet.</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `<div class="clients-grid">${data.clients.map(renderClientCard).join('')}</div>`;
            } catch (error) {
                console.error('Error fetching clients:', error);
                container.innerHTML = `<div class="empty-state">Failed to load clients.</div>`;
            }
        }

        function renderClientCard(client) {
            const statusClass = client.status === 'active' ? 'active' : 'suspended';
            return `
                <a href="/admin/clients/${client.id}" class="client-card">
                    <div class="client-card-header">
                        <div class="client-name">${escapeHtml(client.name)}</div>
                        <span class="status-badge ${statusClass}">${escapeHtml(client.status)}</span>
                    </div>
                    <div class="client-counts">
                        <div class="count-item">
                            <div class="count-value">${client.user_count}</div>
                            <div class="count-label">Users</div>
                        </div>
                        <div class="count-item">
                            <div class="count-value">${client.event_count}</div>
                            <div class="count-label">Events</div>
                        </div>
                        <div class="count-item">
                            <div class="count-value">${client.room_count}</div>
                            <div class="count-label">Rooms</div>
                        </div>
                    </div>
                </a>
            `;
        }

        // ============================================================
        // Generic modal machinery (Phase 6c.2) - see the HTML comment above
        // the #modalOverlay element for the design rationale.
        // ============================================================
        let modalTriggerEl = null;

        function handleModalKeydown(e) {
            if (e.key === 'Escape') closeModal();
        }

        function openModal(html, triggerEl) {
            modalTriggerEl = triggerEl || null;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('modalBox').focus();
            document.addEventListener('keydown', handleModalKeydown);
        }

        // Clears modalContent's innerHTML on close, not just hides it - a
        // one-time secret (API key / temp password) must not linger in the
        // DOM after the modal showing it has been dismissed.
        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalContent').innerHTML = '';
            document.removeEventListener('keydown', handleModalKeydown);
            if (modalTriggerEl) modalTriggerEl.focus();
            modalTriggerEl = null;
        }

        async function copyModalSecret(elementId, buttonEl) {
            const text = document.getElementById(elementId).textContent;
            try {
                await navigator.clipboard.writeText(text);
                const original = buttonEl.textContent;
                buttonEl.textContent = '✅ Copied';
                setTimeout(() => { buttonEl.textContent = original; }, 1500);
            } catch (error) {
                console.error('Copy failed:', error);
            }
        }

        function modalButtonRow(html) {
            return `<div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;">${html}</div>`;
        }
        const CANCEL_BTN_STYLE = 'padding:10px 18px;border-radius:8px;border:1px solid #444;background:transparent;color:#ccc;cursor:pointer;font-size:0.9rem;';
        const PRIMARY_BTN_STYLE = 'padding:10px 18px;border-radius:8px;border:none;background:#2e7d32;color:#fff;cursor:pointer;font-weight:600;font-size:0.9rem;';

        // ============================================================
        // Guided Create Client wizard: name -> API key result -> create
        // first user (or skip) -> temp password result.
        // ============================================================
        let clientWizardState = {};

        function renderCreateClientStep(errorMsg) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Create Client</h2>
                <p style="margin:0 0 16px 0;color:#ccc;font-size:0.9rem;">This provisions a new client and a fresh API key for Companion/API integrations.</p>
                ${errorMsg ? `<div style="background:#b71c1c;color:#fff;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:0.85rem;">${escapeHtml(errorMsg)}</div>` : ''}
                <label style="display:block;font-size:0.8rem;color:#999;margin-bottom:6px;">Client name</label>
                <input id="newClientNameInput" type="text" style="width:100%;padding:10px 12px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#e5e5e5;margin-bottom:20px;box-sizing:border-box;" placeholder="e.g. Acme Events" onkeypress="if(event.key==='Enter') submitCreateClient()">
                ${modalButtonRow(`
                    <button onclick="closeModal()" style="${CANCEL_BTN_STYLE}">Cancel</button>
                    <button onclick="submitCreateClient()" style="${PRIMARY_BTN_STYLE}">Create</button>
                `)}
            `;
        }

        function openCreateClientWizard(triggerEl) {
            clientWizardState = {};
            openModal(renderCreateClientStep(), triggerEl);
            document.getElementById('newClientNameInput').focus();
        }

        async function submitCreateClient() {
            const input = document.getElementById('newClientNameInput');
            const name = input.value.trim();
            if (!name) return;
            try {
                const response = await authFetch('/api/admin/clients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    document.getElementById('modalContent').innerHTML = renderCreateClientStep(data ? data.error : 'Failed to create client. Please try again.');
                    document.getElementById('newClientNameInput').focus();
                    return;
                }
                clientWizardState = { clientId: data.client.id, clientName: data.client.name };
                document.getElementById('modalContent').innerHTML = renderApiKeyResult(data.client.name, data.apiKey);
            } catch (error) {
                console.error('Error creating client:', error);
                document.getElementById('modalContent').innerHTML = renderCreateClientStep('Failed to create client. Please try again.');
            }
        }

        function renderApiKeyResult(clientName, apiKey) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Client created — API key</h2>
                <p style="margin:0 0 8px 0;color:#ccc;font-size:0.9rem;line-height:1.5;">"${escapeHtml(clientName)}" was created. This key is for <strong>Companion and other API integrations</strong> — not for human dashboard login.</p>
                <div id="apiKeyText" style="background:#0a0a0a;border:1px solid #333;border-radius:6px;padding:12px;margin:12px 0;font-family:'Courier New',monospace;font-size:0.85rem;word-break:break-all;user-select:all;">${escapeHtml(apiKey)}</div>
                <p style="margin:0 0 20px 0;color:#f44336;font-size:0.82rem;">⚠ This key will not be shown again. Copy it now - if lost, the recovery path is API key rotation.</p>
                <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                    <button onclick="copyModalSecret('apiKeyText', this)" style="${CANCEL_BTN_STYLE}">📋 Copy</button>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <button onclick="finishClientWizard()" style="${CANCEL_BTN_STYLE}">Done for now</button>
                        <button onclick="goToCreateFirstUser()" style="padding:10px 18px;border-radius:8px;border:none;background:#1976d2;color:#fff;cursor:pointer;font-weight:600;font-size:0.9rem;">Continue → Add first user</button>
                    </div>
                </div>
            `;
        }

        function goToCreateFirstUser() {
            document.getElementById('modalContent').innerHTML = renderCreateFirstUserStep();
            document.getElementById('newUserEmailInput').focus();
        }

        function renderCreateFirstUserStep(errorMsg) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Create first user for "${escapeHtml(clientWizardState.clientName)}"</h2>
                <p style="margin:0 0 16px 0;color:#ccc;font-size:0.9rem;">They'll receive a one-time temporary password and must change it on first login.</p>
                ${errorMsg ? `<div style="background:#b71c1c;color:#fff;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:0.85rem;">${escapeHtml(errorMsg)}</div>` : ''}
                <label style="display:block;font-size:0.8rem;color:#999;margin-bottom:6px;">Email</label>
                <input id="newUserEmailInput" type="email" style="width:100%;padding:10px 12px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#e5e5e5;margin-bottom:20px;box-sizing:border-box;" placeholder="e.g. jamie@client.com" onkeypress="if(event.key==='Enter') submitCreateFirstUser()">
                ${modalButtonRow(`
                    <button onclick="finishClientWizard()" style="${CANCEL_BTN_STYLE}">Skip</button>
                    <button onclick="submitCreateFirstUser()" style="${PRIMARY_BTN_STYLE}">Create User</button>
                `)}
            `;
        }

        async function submitCreateFirstUser() {
            const input = document.getElementById('newUserEmailInput');
            const email = input.value.trim();
            if (!email) return;
            try {
                const response = await authFetch(`/api/admin/clients/${clientWizardState.clientId}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    // Per spec: any failure at this step (the client already exists)
                    // shows a recovery message with a link to the client's detail
                    // page, rather than losing track of the created client.
                    renderWizardRecovery(data && data.error);
                    return;
                }
                document.getElementById('modalContent').innerHTML = renderTempPasswordResult('User created', data.user.email, data.tempPassword, 'finishClientWizard()');
            } catch (error) {
                console.error('Error creating first user:', error);
                renderWizardRecovery();
            }
        }

        function renderWizardRecovery(errorDetail) {
            document.getElementById('modalContent').innerHTML = `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Client created — user creation failed</h2>
                <p style="margin:0 0 8px 0;color:#ccc;font-size:0.9rem;line-height:1.5;">"${escapeHtml(clientWizardState.clientName)}" was created, but creating the first user failed${errorDetail ? ': ' + escapeHtml(errorDetail) : ' unexpectedly'}.</p>
                <p style="margin:0 0 20px 0;color:#ccc;font-size:0.9rem;">You can create a user from the client's detail page.</p>
                <div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;">
                    <button onclick="finishClientWizard()" style="${CANCEL_BTN_STYLE}">Close</button>
                    <a href="/admin/clients/${clientWizardState.clientId}" style="padding:10px 18px;border-radius:8px;border:none;background:#1976d2;color:#fff;cursor:pointer;font-weight:600;font-size:0.9rem;text-decoration:none;display:inline-block;">Go to client →</a>
                </div>
            `;
        }

        // Shared with admin-client-detail.html's Add User / Reset Password
        // flows (each page has its own copy, matching this codebase's existing
        // convention of no shared JS file between pages).
        function renderTempPasswordResult(titleContext, email, tempPassword, onDoneCall) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">${escapeHtml(titleContext)} — temporary password</h2>
                <p style="margin:0 0 8px 0;color:#ccc;font-size:0.9rem;">Email: <strong>${escapeHtml(email)}</strong></p>
                <div id="tempPasswordText" style="background:#0a0a0a;border:1px solid #333;border-radius:6px;padding:12px;margin:12px 0;font-family:'Courier New',monospace;font-size:0.85rem;word-break:break-all;user-select:all;">${escapeHtml(tempPassword)}</div>
                <p style="margin:0 0 20px 0;color:#f44336;font-size:0.82rem;">⚠ This password will not be shown again. Share it with the user via a secure channel - they must change it on first login.</p>
                <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                    <button onclick="copyModalSecret('tempPasswordText', this)" style="${CANCEL_BTN_STYLE}">📋 Copy</button>
                    <button onclick="${onDoneCall}" style="${PRIMARY_BTN_STYLE}">Done</button>
                </div>
            `;
        }

        function finishClientWizard() {
            closeModal();
            fetchClients();
        }

        fetchClients();
    </script>
</body>
</html>
