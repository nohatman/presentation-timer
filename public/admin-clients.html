<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxy's Presentation Timer - Client Management</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            font-size: 2rem;
            color: #fafafa;
        }
        .badge-platform-admin {
            font-size: 0.8rem;
            font-weight: 700;
            background: #6a1b9a;
            color: white;
            padding: 3px 10px;
            border-radius: 5px;
            vertical-align: middle;
            margin-left: 8px;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .nav-link {
            padding: 10px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a1a;
            color: #e5e5e5;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .nav-link:hover {
            background: #252525;
            border-color: #4caf50;
        }
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .client-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: border-color 0.2s, transform 0.2s;
        }
        .client-card:hover {
            border-color: #4caf50;
            transform: translateY(-2px);
        }
        .client-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333;
        }
        .client-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f5f5f5;
            word-break: break-word;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .status-badge.active {
            background: #2e7d32;
            color: white;
        }
        .status-badge.suspended {
            background: #b71c1c;
            color: white;
        }
        .client-counts {
            display: flex;
            justify-content: space-around;
            gap: 0.5rem;
        }
        .count-item {
            text-align: center;
        }
        .count-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #4caf50;
        }
        .count-label {
            font-size: 0.7rem;
            color: #999;
            text-transform: uppercase;
        }
        .empty-state, .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }
            .header {
                padding: 1.1rem;
                margin-bottom: 1rem;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .clients-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🏢 Client Management
                <span class="badge-platform-admin">PLATFORM ADMIN</span>
            </h1>
            <p style="color: #999; margin-top: 0.5rem;">All clients on this platform</p>
        </div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link">← Back to Dashboard</a>
            <button onclick="logout()" class="nav-link" style="cursor:pointer;">🚪 Logout</button>
        </div>
    </div>

    <div id="clientsContainer">
        <div class="loading">Loading clients...</div>
    </div>

    <script>
        // Same authFetch pattern as dashboard.html: 401 -> /login. A 403 here
        // means either "password change required" (mustChangePassword) or "not
        // a platform admin" - the latter shouldn't be reachable at all since the
        // page route itself already redirects non-admins to /dashboard, but the
        // API is independently gated regardless, so handle it defensively too.
        async function authFetch(url, options = {}) {
            const response = await fetch(url, options);

            if (response.status === 401) {
                window.location.href = '/login';
                return response;
            }

            if (response.status === 403) {
                const data = await response.clone().json().catch(() => null);
                if (data && data.mustChangePassword) {
                    window.location.href = '/change-password';
                } else {
                    window.location.href = '/dashboard';
                }
                return response;
            }

            return response;
        }

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (err) {
                console.error('Error logging out:', err);
            }
            window.location.href = '/login';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function fetchClients() {
            const container = document.getElementById('clientsContainer');
            try {
                const response = await authFetch('/api/admin/clients');
                if (!response.ok) return;
                const data = await response.json();
                if (!data.ok) return;

                if (data.clients.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div>No clients yet.</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `<div class="clients-grid">${data.clients.map(renderClientCard).join('')}</div>`;
            } catch (error) {
                console.error('Error fetching clients:', error);
                container.innerHTML = `<div class="empty-state">Failed to load clients.</div>`;
            }
        }

        function renderClientCard(client) {
            const statusClass = client.status === 'active' ? 'active' : 'suspended';
            return `
                <a href="/admin/clients/${client.id}" class="client-card">
                    <div class="client-card-header">
                        <div class="client-name">${escapeHtml(client.name)}</div>
                        <span class="status-badge ${statusClass}">${escapeHtml(client.status)}</span>
                    </div>
                    <div class="client-counts">
                        <div class="count-item">
                            <div class="count-value">${client.user_count}</div>
                            <div class="count-label">Users</div>
                        </div>
                        <div class="count-item">
                            <div class="count-value">${client.event_count}</div>
                            <div class="count-label">Events</div>
                        </div>
                        <div class="count-item">
                            <div class="count-value">${client.room_count}</div>
                            <div class="count-label">Rooms</div>
                        </div>
                    </div>
                </a>
            `;
        }

        fetchClients();
    </script>
</body>
</html>
