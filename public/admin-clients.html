<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxy's Presentation Timer - Client Management</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/foxy.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--desk);
            color: var(--ink);
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            background: var(--panel);
            padding: 2rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            border: 1px solid #3a3c40;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            font-size: 2rem;
            color: var(--ink);
        }
        .badge-platform-admin {
            font-size: 0.8rem;
            font-weight: 700;
            background: #6a1b9a;
            color: white;
            padding: 3px 10px;
            border-radius: var(--radius);
            vertical-align: middle;
            margin-left: 8px;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .nav-link {
            padding: 10px 16px;
            border: 1px solid #3a3c40;
            border-radius: var(--radius);
            background: var(--panel);
            color: var(--ink);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .nav-link:hover {
            background: var(--key);
            border-color: var(--go);
        }
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .client-card {
            background: var(--panel);
            border: 2px solid #3a3c40;
            border-radius: var(--radius);
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: border-color 0.2s, transform 0.2s;
        }
        .client-card:hover {
            border-color: var(--go);
            transform: translateY(-2px);
        }
        .client-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #3a3c40;
        }
        .client-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--ink);
            word-break: break-word;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .status-badge.active {
            background: var(--go-key);
            color: white;
        }
        .status-badge.suspended {
            background: var(--stop-key);
            color: white;
        }
        .client-counts {
            display: flex;
            justify-content: space-around;
            gap: 0.5rem;
        }
        .count-item {
            text-align: center;
        }
        .count-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--go);
        }
        .count-label {
            font-size: 0.7rem;
            color: var(--ink-2);
            }
        /* Enquiries from the landing-page contact form */
        .enquiries { margin-bottom: 2rem; }
        .enquiries h2 { font-size: 1.2rem; color: var(--ink); margin-bottom: 0.9rem; display: flex; align-items: center; gap: 10px; }
        .enq-count { background: var(--key); color: #140800; font-size: 0.75rem; font-weight: 700; padding: 2px 9px; border-radius: var(--radius); }
        .enq-list { display: grid; gap: 0.75rem; }
        .enq {
            background: var(--panel); border: 1px solid #3a3c40; border-left: 4px solid var(--key);
            border-radius: var(--radius); padding: 1rem 1.2rem;
        }
        .enq.handled { border-left-color: #4a4d52; opacity: 0.75; }
        .enq-top { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: baseline; }
        .enq-who { font-weight: 600; color: var(--ink); }
        .enq-who a { color: #90caf9; font-weight: 500; }
        .enq-meta { color: var(--ink-2); font-size: 0.8rem; }
        .enq-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0.6rem 0; }
        .enq-tags span { font-size: 0.75rem; border: 1px solid #4a4d52; border-radius: var(--radius); padding: 2px 9px; color: var(--ink); }
        .enq-msg { color: var(--ink); white-space: pre-wrap; word-break: break-word; font-size: 0.92rem; }
        .enq-actions { margin-top: 0.75rem; }
        .enq-actions button { padding: 7px 14px; border-radius: var(--radius); border: 1px solid #4a4d52; background: var(--panel-hi); color: var(--ink); cursor: pointer; font-size: 0.85rem; }
        .enq-actions button:hover { border-color: var(--go); }
        .enquiries details summary { cursor: pointer; color: var(--ink-2); margin: 0.9rem 0 0.6rem; }
        /* Foxy Timer for Windows trials */
        .wintrials { margin-bottom: 2rem; }
        .wintrials h2 { font-size: 1.2rem; color: var(--ink); margin-bottom: 0.9rem; }
        .wt-box { background: var(--panel); border: 1px solid #3a3c40; border-radius: var(--radius); padding: 1rem 1.2rem; }
        .wt-settings { display: grid; grid-template-columns: auto 1fr; gap: 0.7rem 1rem; align-items: center; }
        .wt-settings label { color: #bbb; font-size: 0.9rem; }
        .wt-settings input { padding: 8px 10px; border-radius: var(--radius); border: 1px solid #4a4d52; background: var(--well); color: var(--ink); font-size: 0.9rem; min-width: 0; }
        .wt-settings input[type=number] { width: 90px; }
        .wt-row-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 0.9rem; }
        .wt-row-actions button, .wt-table button { padding: 7px 14px; border-radius: var(--radius); border: 1px solid #4a4d52; background: var(--panel-hi); color: var(--ink); cursor: pointer; font-size: 0.85rem; }
        .wt-row-actions button:hover, .wt-table button:hover { border-color: var(--go); }
        .wt-note { color: var(--ink-2); font-size: 0.85rem; }
        .wt-note.warn { color: #ffb74d; }
        .wt-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.88rem; }
        .wt-table th { text-align: left; color: var(--ink-2); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #3a3c40; }
        .wt-table td { padding: 8px; border-bottom: 1px solid #222; color: var(--ink); vertical-align: middle; }
        .wt-table input { width: 60px; padding: 5px 6px; border-radius: var(--radius); border: 1px solid #4a4d52; background: var(--well); color: var(--ink); }
        .wt-status-active { color: var(--go); }
        .wt-status-expired { color: #e57373; }
        .wt-scroll { overflow-x: auto; }
        @media (max-width: 700px) { .wt-settings { grid-template-columns: 1fr; } }
        .empty-state, .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--ink-3);
        }
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }
            .header {
                padding: 1.1rem;
                margin-bottom: 1rem;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .clients-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
    </style>
</head>
<body class="foxy">
    <div class="header">
        <div>
            <h1>Client Management
                <span class="badge-platform-admin">PLATFORM ADMIN</span>
            </h1>
            <p style="color: var(--ink-2); margin-top: 0.5rem;">All clients on this platform</p>
        </div>
        <div class="nav-links">
            <button id="createClientBtn" onclick="openCreateClientWizard(this)" class="nav-link" style="cursor:pointer;background:var(--go-key);border-color:var(--go-key);color:white;">Create Client</button>
            <a href="/dashboard" class="nav-link">← Back to Dashboard</a>
            <button onclick="logout()" class="nav-link" style="cursor:pointer;">Logout</button>
        </div>
    </div>

    <section class="enquiries" id="enquiriesSection" style="display:none;">
        <h2>Enquiries <span class="enq-count" id="enqCount"></span></h2>
        <div id="enquiriesContainer"></div>
    </section>

    <section class="wintrials" id="winTrialsSection" style="display:none;">
        <h2>Foxy Timer for Windows trials</h2>
        <div class="wt-box">
            <div class="wt-settings">
                <label for="wtDays">Trial length (days)</label>
                <input type="number" id="wtDays" min="1" max="365" step="1">
                <label for="wtUrl">Download link</label>
                <input type="url" id="wtUrl" placeholder="https://… (the installer, e.g. a GitHub Release file)">
            </div>
            <div class="wt-row-actions">
                <button onclick="saveWinTrialSettings()">Save</button>
                <span class="wt-note" id="wtSaveNote"></span>
            </div>
            <div class="wt-note" id="wtInfo" style="margin-top:0.6rem;"></div>
            <div class="wt-scroll" id="wtList"></div>
        </div>
    </section>

    <div id="clientsContainer">
        <div class="loading">Loading clients...</div>
    </div>

    <!-- Generic modal shell (Phase 6c.2), reused for the guided Create Client
         wizard. Same pattern as control.html's Take Over modal - deliberately
         not window.confirm()/alert()/prompt(): custom overlay, focus moves
         into the dialog on open and back to the trigger element on close,
         Escape and click-outside both close safely. Content is swapped per
         step by the wizard functions below. -->
    <div id="modalOverlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;" onclick="if (event.target === this) closeModal();">
        <div id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1" style="background: var(--panel); border: 1px solid #3a3c40; border-radius: var(--radius); padding: 24px; max-width: 440px; width: 100%; box-sizing: border-box; box-shadow: 0 8px 32px rgba(0,0,0,0.5); outline: none;">
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // Same authFetch pattern as dashboard.html: 401 -> /login. A 403 here
        // means either "password change required" (mustChangePassword) or "not
        // a platform admin" - the latter shouldn't be reachable at all since the
        // page route itself already redirects non-admins to /dashboard, but the
        // API is independently gated regardless, so handle it defensively too.
        async function authFetch(url, options = {}) {
            const response = await fetch(url, options);

            if (response.status === 401) {
                // A session can also fail here because its user/client access is
                // currently paused, not just missing/expired - flagged via reason
                // so /login can show a clear message instead of a dead-cookie feel.
                const data = await response.clone().json().catch(() => null);
                window.location.href = (data && data.reason === 'account_suspended') ? '/login?reason=account_suspended' : '/login';
                return response;
            }

            if (response.status === 403) {
                const data = await response.clone().json().catch(() => null);
                if (data && data.mustChangePassword) {
                    window.location.href = '/change-password';
                } else {
                    window.location.href = '/dashboard';
                }
                return response;
            }

            return response;
        }

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (err) {
                console.error('Error logging out:', err);
            }
            window.location.href = '/login';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function fetchClients() {
            const container = document.getElementById('clientsContainer');
            try {
                const response = await authFetch('/api/admin/clients');
                if (!response.ok) return;
                const data = await response.json();
                if (!data.ok) return;

                if (data.clients.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div>No clients yet.</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `<div class="clients-grid">${data.clients.map(renderClientCard).join('')}</div>`;
            } catch (error) {
                console.error('Error fetching clients:', error);
                container.innerHTML = `<div class="empty-state">Failed to load clients.</div>`;
            }
        }

        // Presentation-language only - the underlying clients.status value stays
        // 'active'/'suspended' everywhere in the API/DB; this just controls what
        // a human reads. Keep in sync with the identical mapper in admin-client-detail.html.
        function statusLabel(status) {
            return status === 'active' ? 'Active' : 'Access Paused';
        }

        function renderClientCard(client) {
            const statusClass = client.status === 'active' ? 'active' : 'suspended';
            return `
                <a href="/admin/clients/${client.id}" class="client-card">
                    <div class="client-card-header">
                        <div class="client-name">${escapeHtml(client.name)}</div>
                        <span class="status-badge ${statusClass}">${escapeHtml(statusLabel(client.status))}</span>
                    </div>
                    <div class="client-counts">
                        <div class="count-item">
                            <div class="count-value">${client.user_count}</div>
                            <div class="count-label">Users</div>
                        </div>
                        <div class="count-item">
                            <div class="count-value">${client.event_count}</div>
                            <div class="count-label">Events</div>
                        </div>
                        <div class="count-item">
                            <div class="count-value">${client.room_count}</div>
                            <div class="count-label">Rooms</div>
                        </div>
                    </div>
                </a>
            `;
        }

        // ============================================================
        // Generic modal machinery (Phase 6c.2) - see the HTML comment above
        // the #modalOverlay element for the design rationale.
        // ============================================================
        let modalTriggerEl = null;

        function handleModalKeydown(e) {
            if (e.key === 'Escape') closeModal();
        }

        function openModal(html, triggerEl) {
            modalTriggerEl = triggerEl || null;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('modalBox').focus();
            document.addEventListener('keydown', handleModalKeydown);
        }

        // Clears modalContent's innerHTML on close, not just hides it - a
        // one-time secret (API key / temp password) must not linger in the
        // DOM after the modal showing it has been dismissed.
        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalContent').innerHTML = '';
            document.removeEventListener('keydown', handleModalKeydown);
            if (modalTriggerEl) modalTriggerEl.focus();
            modalTriggerEl = null;
        }

        async function copyModalSecret(elementId, buttonEl) {
            const text = document.getElementById(elementId).textContent;
            try {
                await navigator.clipboard.writeText(text);
                const original = buttonEl.textContent;
                buttonEl.textContent = 'Copied';
                setTimeout(() => { buttonEl.textContent = original; }, 1500);
            } catch (error) {
                console.error('Copy failed:', error);
            }
        }

        function modalButtonRow(html) {
            return `<div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;">${html}</div>`;
        }
        const CANCEL_BTN_STYLE = 'padding:10px 18px;border-radius: var(--radius);border:1px solid #4a4d52;background:transparent;color:var(--ink);cursor:pointer;font-size:0.9rem;';
        const PRIMARY_BTN_STYLE = 'padding:10px 18px;border-radius: var(--radius);border:none;background:var(--go-key);color:#fff;cursor:pointer;font-weight:600;font-size:0.9rem;';

        // ============================================================
        // Guided Create Client wizard: name -> API key result -> create
        // first user (or skip) -> temp password result.
        // ============================================================
        let clientWizardState = {};

        function renderCreateClientStep(errorMsg) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:var(--ink);">Create Client</h2>
                <p style="margin:0 0 16px 0;color:var(--ink);font-size:0.9rem;">This provisions a new client and a fresh API key for Companion/API integrations.</p>
                ${errorMsg ? `<div style="background:var(--stop-key);color:#fff;padding:8px 12px;border-radius: var(--radius);margin-bottom:12px;font-size:0.85rem;">${escapeHtml(errorMsg)}</div>` : ''}
                <label style="display:block;font-size:0.8rem;color:var(--ink-2);margin-bottom:6px;">Client name</label>
                <input id="newClientNameInput" type="text" style="width:100%;padding:10px 12px;border-radius: var(--radius);border:1px solid #3a3c40;background:var(--desk);color:var(--ink);margin-bottom:20px;box-sizing:border-box;" placeholder="e.g. Acme Events" onkeypress="if(event.key==='Enter') submitCreateClient()">
                ${modalButtonRow(`
                    <button onclick="closeModal()" style="${CANCEL_BTN_STYLE}">Cancel</button>
                    <button onclick="submitCreateClient()" style="${PRIMARY_BTN_STYLE}">Create</button>
                `)}
            `;
        }

        function openCreateClientWizard(triggerEl) {
            clientWizardState = {};
            openModal(renderCreateClientStep(), triggerEl);
            document.getElementById('newClientNameInput').focus();
        }

        async function submitCreateClient() {
            const input = document.getElementById('newClientNameInput');
            const name = input.value.trim();
            if (!name) return;
            try {
                const response = await authFetch('/api/admin/clients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    document.getElementById('modalContent').innerHTML = renderCreateClientStep(data ? data.error : 'Failed to create client. Please try again.');
                    document.getElementById('newClientNameInput').focus();
                    return;
                }
                clientWizardState = { clientId: data.client.id, clientName: data.client.name };
                document.getElementById('modalContent').innerHTML = renderApiKeyResult(data.client.name, data.apiKey);
            } catch (error) {
                console.error('Error creating client:', error);
                document.getElementById('modalContent').innerHTML = renderCreateClientStep('Failed to create client. Please try again.');
            }
        }

        function renderApiKeyResult(clientName, apiKey) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:var(--ink);">Client created — API key</h2>
                <p style="margin:0 0 8px 0;color:var(--ink);font-size:0.9rem;line-height:1.5;">"${escapeHtml(clientName)}" was created. This key is for <strong>Companion and other API integrations</strong> — not for human dashboard login.</p>
                <div id="apiKeyText" style="background:var(--desk);border:1px solid #3a3c40;border-radius: var(--radius);padding:12px;margin:12px 0;font-family:'Courier New',monospace;font-size:0.85rem;word-break:break-all;user-select:all;">${escapeHtml(apiKey)}</div>
                <p style="margin:0 0 8px 0;color:#f44336;font-size:0.82rem;">This key will not be shown again. Copy it now - if lost, the recovery path is API key rotation.</p>
                <p style="margin:0 0 20px 0;color:var(--ink-2);font-size:0.82rem;line-height:1.5;">You don't need to send it to the customer: they can make their own key from <b>Dashboard → Companion</b>.</p>
                <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                    <button onclick="copyModalSecret('apiKeyText', this)" style="${CANCEL_BTN_STYLE}">Copy</button>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <button onclick="finishClientWizard()" style="${CANCEL_BTN_STYLE}">Done for now</button>
                        <button onclick="goToCreateFirstUser()" style="padding:10px 18px;border-radius: var(--radius);border:none;background:var(--key);color:#fff;cursor:pointer;font-weight:600;font-size:0.9rem;">Continue → Add first user</button>
                    </div>
                </div>
            `;
        }

        function goToCreateFirstUser() {
            document.getElementById('modalContent').innerHTML = renderCreateFirstUserStep();
            document.getElementById('newUserEmailInput').focus();
        }

        function renderCreateFirstUserStep(errorMsg) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:var(--ink);">Create first user for "${escapeHtml(clientWizardState.clientName)}"</h2>
                <p style="margin:0 0 16px 0;color:var(--ink);font-size:0.9rem;">They'll receive a one-time temporary password and must change it on first login.</p>
                ${errorMsg ? `<div style="background:var(--stop-key);color:#fff;padding:8px 12px;border-radius: var(--radius);margin-bottom:12px;font-size:0.85rem;">${escapeHtml(errorMsg)}</div>` : ''}
                <label style="display:block;font-size:0.8rem;color:var(--ink-2);margin-bottom:6px;">Email</label>
                <input id="newUserEmailInput" type="email" style="width:100%;padding:10px 12px;border-radius: var(--radius);border:1px solid #3a3c40;background:var(--desk);color:var(--ink);margin-bottom:20px;box-sizing:border-box;" placeholder="e.g. jamie@client.com" onkeypress="if(event.key==='Enter') submitCreateFirstUser()">
                ${modalButtonRow(`
                    <button onclick="finishClientWizard()" style="${CANCEL_BTN_STYLE}">Skip</button>
                    <button onclick="submitCreateFirstUser()" style="${PRIMARY_BTN_STYLE}">Create User</button>
                `)}
            `;
        }

        async function submitCreateFirstUser() {
            const input = document.getElementById('newUserEmailInput');
            const email = input.value.trim();
            if (!email) return;
            try {
                const response = await authFetch(`/api/admin/clients/${clientWizardState.clientId}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json().catch(() => null);
                if (!data || !data.ok) {
                    // Per spec: any failure at this step (the client already exists)
                    // shows a recovery message with a link to the client's detail
                    // page, rather than losing track of the created client.
                    renderWizardRecovery(data && data.error);
                    return;
                }
                document.getElementById('modalContent').innerHTML = renderTempPasswordResult('User created', data.user.email, data.tempPassword, 'finishClientWizard()');
            } catch (error) {
                console.error('Error creating first user:', error);
                renderWizardRecovery();
            }
        }

        function renderWizardRecovery(errorDetail) {
            document.getElementById('modalContent').innerHTML = `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:var(--ink);">Client created — user creation failed</h2>
                <p style="margin:0 0 8px 0;color:var(--ink);font-size:0.9rem;line-height:1.5;">"${escapeHtml(clientWizardState.clientName)}" was created, but creating the first user failed${errorDetail ? ': ' + escapeHtml(errorDetail) : ' unexpectedly'}.</p>
                <p style="margin:0 0 20px 0;color:var(--ink);font-size:0.9rem;">You can create a user from the client's detail page.</p>
                <div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;">
                    <button onclick="finishClientWizard()" style="${CANCEL_BTN_STYLE}">Close</button>
                    <a href="/admin/clients/${clientWizardState.clientId}" style="padding:10px 18px;border-radius: var(--radius);border:none;background:var(--key);color:#fff;cursor:pointer;font-weight:600;font-size:0.9rem;text-decoration:none;display:inline-block;">Go to client →</a>
                </div>
            `;
        }

        // Shared with admin-client-detail.html's Add User / Reset Password
        // flows (each page has its own copy, matching this codebase's existing
        // convention of no shared JS file between pages).
        function renderTempPasswordResult(titleContext, email, tempPassword, onDoneCall) {
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:var(--ink);">${escapeHtml(titleContext)} — temporary password</h2>
                <p style="margin:0 0 8px 0;color:var(--ink);font-size:0.9rem;">Email: <strong>${escapeHtml(email)}</strong></p>
                <div id="tempPasswordText" style="background:var(--desk);border:1px solid #3a3c40;border-radius: var(--radius);padding:12px;margin:12px 0;font-family:'Courier New',monospace;font-size:0.85rem;word-break:break-all;user-select:all;">${escapeHtml(tempPassword)}</div>
                <p style="margin:0 0 20px 0;color:#f44336;font-size:0.82rem;">This password will not be shown again. Share it with the user via a secure channel - they must change it on first login.</p>
                <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                    <button onclick="copyModalSecret('tempPasswordText', this)" style="${CANCEL_BTN_STYLE}">Copy</button>
                    <button onclick="${onDoneCall}" style="${PRIMARY_BTN_STYLE}">Done</button>
                </div>
            `;
        }

        function finishClientWizard() {
            closeModal();
            fetchClients();
        }

        // Landing-page contact form enquiries. Hidden entirely until there is
        // at least one, so the page looks as before on a fresh install.
        const INTEREST_LABELS = { feedback: 'Feedback', trial: 'Account for a show', local: 'Foxy Timer for Windows', companion: 'Companion', call: 'Quick call' };
        const EMAIL_STATUS_LABELS = { sent: 'emailed', not_configured: 'email not set up' };

        function renderEnquiry(e) {
            const when = new Date(e.created_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            const emailNote = e.email_status ? ` · ${escapeHtml(EMAIL_STATUS_LABELS[e.email_status] || 'email failed')}` : '';
            const tags = e.interests.map((i) => `<span>${escapeHtml(INTEREST_LABELS[i] || i)}</span>`).join('');
            return `
                <div class="enq ${e.handled_at ? 'handled' : ''}">
                    <div class="enq-top">
                        <div class="enq-who">${escapeHtml(e.name)}${e.company ? ' · ' + escapeHtml(e.company) : ''}
                            &nbsp;<a href="mailto:${encodeURIComponent(e.email)}">${escapeHtml(e.email)}</a></div>
                        <div class="enq-meta">${escapeHtml(when)}${emailNote}</div>
                    </div>
                    ${tags ? `<div class="enq-tags">${tags}</div>` : ''}
                    ${e.message ? `<div class="enq-msg">${escapeHtml(e.message)}</div>` : ''}
                    <div class="enq-actions">
                        <button onclick="setEnquiryHandled(${e.id}, ${e.handled_at ? 'false' : 'true'})">${e.handled_at ? 'Reopen' : '✓ Mark handled'}</button>
                    </div>
                </div>
            `;
        }

        async function fetchEnquiries() {
            try {
                const response = await authFetch('/api/admin/enquiries');
                if (!response.ok) return;
                const data = await response.json();
                if (!data.ok || data.enquiries.length === 0) return;
                const open = data.enquiries.filter((e) => !e.handled_at);
                const done = data.enquiries.filter((e) => e.handled_at);
                document.getElementById('enquiriesSection').style.display = '';
                const count = document.getElementById('enqCount');
                count.textContent = open.length ? `${open.length} new` : '';
                count.style.display = open.length ? '' : 'none';
                document.getElementById('enquiriesContainer').innerHTML =
                    (open.length ? `<div class="enq-list">${open.map(renderEnquiry).join('')}</div>` : '<div style="color:#777;">Nothing waiting.</div>') +
                    (done.length ? `<details><summary>Handled (${done.length})</summary><div class="enq-list">${done.map(renderEnquiry).join('')}</div></details>` : '');
            } catch (error) {
                console.error('Error fetching enquiries:', error);
            }
        }

        async function setEnquiryHandled(id, handled) {
            const response = await authFetch(`/api/admin/enquiries/${id}/handled`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ handled })
            });
            if (response.ok) fetchEnquiries();
        }

        // Foxy Timer for Windows trials: the trial length and download link
        // settings, and each laptop that has started a trial.
        function fmtDate(ms) {
            return new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        async function fetchWinTrials() {
            try {
                const response = await authFetch('/api/admin/windows-trials');
                if (!response.ok) return;
                const data = await response.json();
                if (!data.ok) return;
                document.getElementById('winTrialsSection').style.display = '';
                document.getElementById('wtDays').value = data.settings.trialDays;
                document.getElementById('wtUrl').value = data.settings.downloadUrl;
                const info = document.getElementById('wtInfo');
                if (!data.settings.signingConfigured) {
                    info.className = 'wt-note warn';
                    info.textContent = "Trials can't start yet: FOXY_LICENCE_PRIVATE_KEY is not set on this server.";
                } else {
                    info.className = 'wt-note';
                    info.textContent = 'A new length applies to trials that start after you save it. The download button on the website only appears once there is a download link.';
                }
                const now = Date.now();
                const rows = data.trials.map((t) => {
                    const active = t.expires_at > now;
                    const left = Math.ceil((t.expires_at - now) / 86400000);
                    const ends = active ? `${left} ${left === 1 ? 'day' : 'days'} left` : 'ended';
                    return `<tr>
                        <td>#${t.id}</td>
                        <td>${escapeHtml(fmtDate(t.issued_at))}</td>
                        <td class="${active ? 'wt-status-active' : 'wt-status-expired'}">${escapeHtml(fmtDate(t.expires_at))} · ${ends}</td>
                        <td>${escapeHtml(fmtDate(t.last_seen_at))}</td>
                        <td>${escapeHtml(t.app_version || '')}</td>
                        <td style="white-space:nowrap;"><input type="number" min="1" max="365" value="${data.settings.trialDays}" id="wtExt${t.id}" aria-label="Days to add"> <button onclick="extendWinTrial(${t.id})">Add days</button></td>
                    </tr>`;
                }).join('');
                document.getElementById('wtList').innerHTML = data.trials.length
                    ? `<table class="wt-table"><thead><tr><th>Laptop</th><th>Started</th><th>Ends</th><th>Last seen</th><th>Version</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
                    : '<div class="wt-note" style="margin-top:1rem;">No trials started yet.</div>';
            } catch (error) {
                console.error('Error fetching Windows trials:', error);
            }
        }

        async function saveWinTrialSettings() {
            const note = document.getElementById('wtSaveNote');
            const response = await authFetch('/api/admin/windows-trials/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    trialDays: Number(document.getElementById('wtDays').value),
                    downloadUrl: document.getElementById('wtUrl').value
                })
            });
            const data = await response.json().catch(() => ({}));
            note.className = response.ok ? 'wt-note' : 'wt-note warn';
            note.textContent = response.ok ? 'Saved' : (data.error || 'Could not save');
            if (response.ok) fetchWinTrials();
        }

        async function extendWinTrial(id) {
            const days = Number(document.getElementById('wtExt' + id).value);
            const response = await authFetch(`/api/admin/windows-trials/${id}/extend`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ days })
            });
            if (response.ok) fetchWinTrials();
        }

        fetchEnquiries();
        fetchWinTrials();
        fetchClients();
    </script>
</body>
</html>
