<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxy's Presentation Timer - Master Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            font-size: 2rem;
            color: #fafafa;
        }
        .header-info {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: center;
        }
        .header-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: flex-end;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4caf50;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #999;
            text-transform: uppercase;
        }
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 1.5rem;
        }
        .room-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            cursor: move;
            position: relative;
        }
        .room-card.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }
        .room-card.drag-over {
            border-color: #4caf50;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
        }
        .room-card.running {
            border-color: #4caf50;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.2);
        }
        .room-card.paused {
            border-color: #ff9800;
            box-shadow: 0 4px 20px rgba(255, 152, 0, 0.2);
        }
        .room-card.stopped {
            border-color: #666;
        }
        .drag-handle {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.2rem;
            color: #666;
            user-select: none;
        }
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333;
        }
        .room-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f5f5f5;
            word-break: break-word;
        }
        .room-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .room-status.running {
            background: #4caf50;
            color: white;
        }
        .room-status.paused {
            background: #ff9800;
            color: white;
        }
        .room-status.stopped {
            background: #666;
            color: white;
        }
        .room-timer {
            text-align: center;
            margin: 1.5rem 0;
        }
        .timer-display {
            font-size: 3.5rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #4caf50;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }
        .timer-display.amber {
            color: #ffb300;
            text-shadow: 0 0 20px rgba(255, 179, 0, 0.3);
        }
        .timer-display.red {
            color: #f44336;
            text-shadow: 0 0 20px rgba(244, 67, 54, 0.3);
            animation: urgentPulse 1s ease-in-out infinite;
        }
        .timer-display.clock {
            color: #e5e5e5;
            text-shadow: 0 0 20px rgba(229, 229, 229, 0.2);
        }
        @keyframes urgentPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .timer-mode {
            font-size: 0.9rem;
            color: #999;
            margin-top: 0.5rem;
        }
        .room-info {
            display: flex;
            justify-content: space-around;
            gap: 1rem;
            margin: 1rem 0;
            padding: 1rem;
            background: #0a0a0a;
            border-radius: 8px;
        }
        .info-item {
            text-align: center;
        }
        .info-label {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e5e5e5;
        }
        /* Phase 6b: three-tier visual hierarchy for room-card actions, per explicit
           decision - every action stays visible and reachable (no menu, nothing
           hidden), just sized/weighted differently:
             1. Primary timer action (Start/Pause/Resume) - full width, boldest.
             2. Open/view actions (Control Panel, Display) - own row, easy to reach,
                keep their existing distinct colours.
             3. Secondary/destructive (New Links, Delete) - smaller, muted; Delete
                keeps its red .danger colour so it still reads as destructive. */
        .room-actions {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .room-actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }
        .action-btn.primary-action {
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 700;
        }
        .action-btn.secondary-action {
            padding: 7px 10px;
            font-size: 0.78rem;
            font-weight: 500;
            opacity: 0.9;
        }
        .action-btn.secondary-action:hover {
            opacity: 1;
        }
        .action-btn {
            padding: 10px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a1a;
            color: #e5e5e5;
            text-decoration: none;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            cursor: pointer;
        }
        .action-btn:hover {
            background: #252525;
            border-color: #4caf50;
            transform: translateY(-2px);
            animation: none !important;
        }
        .action-btn.control {
            background: #1976d2;
            border-color: #1976d2;
            color: white;
        }
        .action-btn.control:hover {
            background: #1565c0;
            border-color: #1565c0;
        }
        .action-btn.display {
            background: #2e7d32;
            border-color: #2e7d32;
            color: white;
        }
        .action-btn.display:hover {
            background: #256628;
            border-color: #256628;
        }
        .action-btn.danger {
            background: #b71c1c;
            border-color: #b71c1c;
            color: white;
        }
        .action-btn.danger:hover {
            background: #941616;
            border-color: #941616;
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .action-btn:disabled:hover {
            background: #4caf50;
            border-color: #4caf50;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #666;
        }
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .empty-state-text {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .empty-state-hint {
            font-size: 0.9rem;
            color: #999;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #999;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .create-room-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .create-room-row input {
            flex: 1;
            max-width: 320px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #101010;
            color: #e5e5e5;
        }
        .nav-link {
            padding: 8px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a1a;
            color: #e5e5e5;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, border-color 0.2s;
        }
        .nav-link:hover {
            background: #252525;
            border-color: #4caf50;
        }

        /* Phase 6b mobile fix. Root causes found by inspection (not guesswork,
           same method as the Phase 4 control.html fix):
             1. .rooms-grid used minmax(400px, 1fr) - a hard per-card minimum
                width that never shrank regardless of viewport.
             2. body had a flat 20px padding on every side, eating into the
                already-scarce width on a narrow phone.
             3. .header-info and .nav-links were flex with no flex-wrap of their
                own - the outer .header could wrap them as a unit, but nothing
                inside could wrap further once it landed on its own line.
           Desktop rules above this block are untouched. */
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }
            .header {
                padding: 1.1rem;
                margin-bottom: 1rem;
                gap: 0.75rem;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .header-info {
                gap: 1rem;
                width: 100%;
                justify-content: space-between;
            }
            .header-actions {
                align-items: flex-start;
                width: 100%;
            }
            .nav-link {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            .rooms-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .room-card {
                padding: 1rem;
            }
            .create-room-row {
                flex-direction: column;
            }
            .create-room-row input {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🎯 Master Dashboard
                <span id="platformAdminBadge" style="display:none;font-size:0.8rem;font-weight:700;background:#6a1b9a;color:white;padding:3px 10px;border-radius:5px;vertical-align:middle;margin-left:8px;">PLATFORM ADMIN — ALL CLIENTS</span>
            </h1>
            <p style="color: #999; margin-top: 0.5rem;">Monitor all active presentation timers</p>
        </div>
        <div class="header-info">
            <div class="stat">
                <div class="stat-value" id="totalRooms">0</div>
                <div class="stat-label">Active Rooms</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalConnections">0</div>
                <div class="stat-label">Connections</div>
            </div>
            <div class="header-actions">
                <div class="nav-links">
                    <a href="/" class="nav-link">🏠 Home</a>
                    <a href="/admin/clients" id="manageClientsLink" class="nav-link" style="display:none;">🏢 Manage Clients</a>
                    <button onclick="logout()" class="nav-link" style="cursor:pointer;">🚪 Logout</button>
                </div>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end;">
                    <button id="startAllBtn" onclick="startAllRooms()" class="nav-link" style="background:#2e7d32;border-color:#2e7d32;color:white;cursor:pointer;">▶ Start All</button>
                    <button onclick="stopAllRooms()" class="nav-link" style="background:#b71c1c;border-color:#b71c1c;color:white;cursor:pointer;">⏹ Stop All</button>
                    <button id="startSelectedBtn" onclick="startSelectedRooms()" class="nav-link" style="display:none;background:#1976d2;border-color:#1976d2;color:white;cursor:pointer;">▶ Start Selected (0)</button>
                </div>
            </div>
        </div>
        <div id="createRoomRow" class="create-room-row">
            <input type="text" id="newRoomSlug" placeholder="New room name (e.g. main-stage)"
                   onkeypress="if(event.key==='Enter') createRoom()">
            <button onclick="createRoom(this)" class="nav-link" style="background:#2e7d32;border-color:#2e7d32;color:white;cursor:pointer;">➕ Create Room</button>
        </div>
    </div>

    <div id="roomsContainer" class="rooms-grid">
        <div class="loading">Loading rooms...</div>
    </div>

    <!-- Generic modal shell (dashboard UX fix), same pattern as control.html's
         Take Over modal and the Phase 6c admin pages: custom overlay, never
         alert()/prompt()/confirm(), focus moves into the dialog on open and
         back to the trigger element on close, Escape and click-outside both
         close safely. Used for the Room Links modal (room creation / New
         Links) and its regenerate-confirmation step. max-height/overflow-y
         so the link fields never force the page itself to scroll/overflow
         on a short mobile viewport. -->
    <div id="modalOverlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;" onclick="if (event.target === this) closeModal();">
        <div id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1" style="background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 24px; max-width: 480px; width: 100%; box-sizing: border-box; box-shadow: 0 8px 32px rgba(0,0,0,0.5); outline: none; max-height: 90vh; overflow-y: auto;">
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        let roomsData = [];
        let cardOrder = [];
        let draggedElement = null;
        const selectedRooms = new Set();
        let isPlatformAdmin = false; // set from GET /api/whoami - drives cross-client view

        // ============================================================
        // Session authentication (Phase 6a) - the normal human workflow is
        // sign in at /login, which sets an HttpOnly session cookie; the browser
        // then attaches it automatically to every same-origin fetch() below, no
        // header needed. The dashboard no longer prompts for or stores an API
        // key - Bearer-key auth still works server-side exactly as before for
        // Companion/API integrations, it's just no longer part of this UI.
        // ============================================================

        async function authFetch(url, options = {}) {
            const response = await fetch(url, options);

            if (response.status === 401) {
                // No valid session (never logged in, expired, or revoked) - OR a
                // session that's still technically valid but whose user/client
                // access is currently paused, flagged via reason so /login can
                // show a clear message instead of looking like a dead cookie.
                const data = await response.clone().json().catch(() => null);
                window.location.href = (data && data.reason === 'account_suspended') ? '/login?reason=account_suspended' : '/login';
                return response;
            }

            if (response.status === 403) {
                // Only ever means one thing at this auth layer: password change
                // required before the account can use the dashboard at all.
                const data = await response.clone().json().catch(() => null);
                if (data && data.mustChangePassword) {
                    window.location.href = '/change-password';
                    return response;
                }
            }

            return response;
        }

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (err) {
                console.error('Error logging out:', err);
            }
            window.location.href = '/login';
        }

        // Determines whether this is a platform-admin session (cross-client view)
        // vs a normal client - drives whether Start All is shown, whether the
        // "Create Room" field is shown, and the confirmation wording used below.
        async function refreshWhoAmI() {
            try {
                const response = await authFetch('/api/whoami');
                const data = await response.json();
                if (data.ok) {
                    isPlatformAdmin = !!data.isPlatformAdmin;
                }
            } catch (error) {
                console.error('Error fetching whoami:', error);
            }
            document.getElementById('platformAdminBadge').style.display = isPlatformAdmin ? 'inline-block' : 'none';
            document.getElementById('manageClientsLink').style.display = isPlatformAdmin ? 'inline-block' : 'none';
            // Platform-wide Start All doesn't exist - see Phase 3 notes. Client-scoped
            // Start All (the normal case) is completely unaffected.
            document.getElementById('startAllBtn').style.display = isPlatformAdmin ? 'none' : 'inline-block';
            // Room creation is a Client Administrator action; a platform admin has no
            // single client to create the room under, so this stays CLI-only for now.
            document.getElementById('createRoomRow').style.display = isPlatformAdmin ? 'none' : 'flex';
        }

        async function createRoom(triggerEl) {
            const input = document.getElementById('newRoomSlug');
            const slug = input.value.trim();
            if (!slug) return;

            try {
                const response = await authFetch('/api/rooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slug })
                });
                const data = await response.json();
                if (!data.ok) {
                    alert(`❌ ${data.error || 'Failed to create room'}`);
                    return;
                }
                input.value = '';
                await fetchRooms();
                openRoomLinksModal('Room created', slug, data.controlUrl, data.displayUrl, triggerEl);
            } catch (error) {
                console.error('Error creating room:', error);
                alert('❌ Failed to create room. Please try again.');
            }
        }

        function regenerateLinks(id, triggerEl) {
            const room = roomsData.find(r => r.id === id);
            if (!room) return;
            openModal(renderRegenerateConfirm(room), triggerEl);
        }

        function renderRegenerateConfirm(room) {
            const message = room.clientName
                ? `Regenerate links for "${escapeHtml(room.slug)}" belonging to client "${escapeHtml(room.clientName)}"? The old control/display links will stop working immediately.`
                : `Regenerate links for "${escapeHtml(room.slug)}"? The old control/display links will stop working immediately.`;
            return `
                <h2 id="modalTitle" style="margin:0 0 12px 0;font-size:1.2rem;color:#fafafa;">Regenerate links?</h2>
                <p style="margin:0 0 20px 0;color:#ccc;font-size:0.9rem;line-height:1.5;">${message}</p>
                <div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;">
                    <button onclick="closeModal()" style="padding:10px 18px;border-radius:8px;border:1px solid #444;background:transparent;color:#ccc;cursor:pointer;font-size:0.9rem;">Cancel</button>
                    <button onclick="confirmRegenerateLinks('${escapeHtml(room.id)}')" style="padding:10px 18px;border-radius:8px;border:none;background:#455a64;color:#fff;cursor:pointer;font-weight:600;font-size:0.9rem;">Regenerate</button>
                </div>
            `;
        }

        async function confirmRegenerateLinks(id) {
            const room = roomsData.find(r => r.id === id);
            if (!room) return;

            try {
                const response = await authFetch(roomActionUrl(room, 'regenerate-tokens'), { method: 'POST' });
                const data = await response.json();
                if (!data.ok) {
                    closeModal();
                    alert(`❌ ${data.error || 'Failed to regenerate links'}`);
                    return;
                }
                await fetchRooms();
                document.getElementById('modalContent').innerHTML = renderRoomLinksModal('New room links', room.slug, data.controlUrl, data.displayUrl);
            } catch (error) {
                console.error('Error regenerating links:', error);
                closeModal();
                alert('❌ Failed to regenerate links. Please try again.');
            }
        }

        // ============================================================
        // Generic modal machinery - see the HTML comment above #modalOverlay
        // for the design rationale.
        // ============================================================
        let modalTriggerEl = null;

        function handleModalKeydown(e) {
            if (e.key === 'Escape') closeModal();
        }

        function openModal(html, triggerEl) {
            modalTriggerEl = triggerEl || null;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('modalBox').focus();
            document.addEventListener('keydown', handleModalKeydown);
        }

        // Clears modalContent's innerHTML on close, not just hides it - link
        // values (and anything else shown in a modal) must not linger in the
        // DOM after it's been dismissed.
        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalContent').innerHTML = '';
            document.removeEventListener('keydown', handleModalKeydown);
            if (modalTriggerEl) modalTriggerEl.focus();
            modalTriggerEl = null;
        }

        function flashCopied(buttonEl) {
            const original = buttonEl.textContent;
            buttonEl.textContent = '✅ Copied';
            setTimeout(() => { buttonEl.textContent = original; }, 1500);
        }

        async function copyLink(elementId, buttonEl) {
            const text = document.getElementById(elementId).value;
            try {
                await navigator.clipboard.writeText(text);
                flashCopied(buttonEl);
            } catch (error) {
                console.error('Copy failed:', error);
            }
        }

        // navigator.share() rejects with AbortError when the user cancels the
        // native share sheet - that's not a failure, so it doesn't fall back
        // to copying. Any other failure (or the API being unavailable, though
        // the Share button is only rendered when it exists) falls back to a
        // clean copy rather than an error alert.
        async function shareLink(title, elementId, buttonEl) {
            const url = document.getElementById(elementId).value;
            try {
                await navigator.share({ title, url });
            } catch (error) {
                if (error && error.name === 'AbortError') return;
                console.error('Share failed, falling back to copy:', error);
                await copyLink(elementId, buttonEl);
            }
        }

        async function copyBothLinks(buttonEl) {
            const control = document.getElementById('controlLinkText').value;
            const display = document.getElementById('displayLinkText').value;
            try {
                await navigator.clipboard.writeText(`Control: ${control}\nDisplay: ${display}`);
                flashCopied(buttonEl);
            } catch (error) {
                console.error('Copy failed:', error);
            }
        }

        async function shareBothLinks(roomSlug, buttonEl) {
            const control = document.getElementById('controlLinkText').value;
            const display = document.getElementById('displayLinkText').value;
            try {
                await navigator.share({ title: roomSlug, text: `Control: ${control}\nDisplay: ${display}` });
            } catch (error) {
                if (error && error.name === 'AbortError') return;
                console.error('Share failed, falling back to copy:', error);
                await copyBothLinks(buttonEl);
            }
        }

        const LINK_BTN_STYLE = 'padding:8px 12px;border-radius:6px;border:1px solid #444;background:#1a1a1a;color:#ccc;cursor:pointer;font-size:0.8rem;white-space:nowrap;';
        const LINK_SECONDARY_ROW_BTN_STYLE = 'padding:8px 14px;border-radius:6px;border:1px solid #444;background:transparent;color:#ccc;cursor:pointer;font-size:0.82rem;white-space:nowrap;';

        function renderLinkField(labelText, inputId, url, shareTitle, canShare) {
            return `
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:0.78rem;color:#999;text-transform:uppercase;margin-bottom:6px;">${escapeHtml(labelText)}</label>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                        <input id="${inputId}" type="text" readonly value="${escapeHtml(url)}" onclick="this.select()" style="flex:1;min-width:0;padding:10px 12px;border-radius:6px;border:1px solid #333;background:#0a0a0a;color:#e5e5e5;font-family:'Courier New',monospace;font-size:0.78rem;box-sizing:border-box;overflow-x:auto;">
                        <div style="display:flex;gap:6px;flex-wrap:wrap;">
                            <button onclick="copyLink('${inputId}', this)" style="${LINK_BTN_STYLE}">📋 Copy</button>
                            ${canShare ? `<button onclick="shareLink('${escapeHtml(shareTitle)}', '${inputId}', this)" style="${LINK_BTN_STYLE}">📤 Share</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Reused for room creation, New Links regeneration, and (per the
        // requirement) any other room-card action that displays control/
        // display links. Deliberately calm wording, no "save this now" /
        // "cannot be recovered" language - links can be reopened from the
        // room card or regenerated later, and regeneration is always its own
        // separately-confirmed step (never triggered by opening this modal).
        function renderRoomLinksModal(title, roomSlug, controlUrl, displayUrl) {
            const canShare = typeof navigator.share === 'function';
            return `
                <h2 id="modalTitle" style="margin:0 0 4px 0;font-size:1.2rem;color:#fafafa;">${escapeHtml(title)}</h2>
                <p style="margin:0 0 14px 0;color:#f5f5f5;font-size:0.95rem;font-weight:600;">${escapeHtml(roomSlug)}</p>
                <p style="margin:0 0 20px 0;color:#999;font-size:0.85rem;line-height:1.5;">Use the control link for the operator and the display link for the presentation screen. You can open these links again from the room card.</p>
                ${renderLinkField('Control link', 'controlLinkText', controlUrl, `${roomSlug} - Control`, canShare)}
                ${renderLinkField('Display link', 'displayLinkText', displayUrl, `${roomSlug} - Display`, canShare)}
                <div style="display:flex;justify-content:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
                    <button onclick="copyBothLinks(this)" style="${LINK_SECONDARY_ROW_BTN_STYLE}">📋 Copy both links</button>
                    ${canShare ? `<button onclick="shareBothLinks('${escapeHtml(roomSlug)}', this)" style="${LINK_SECONDARY_ROW_BTN_STYLE}">📤 Share both links</button>` : ''}
                </div>
                <div style="display:flex;justify-content:flex-end;">
                    <button onclick="closeModal()" style="padding:10px 18px;border-radius:8px;border:none;background:#2e7d32;color:#fff;cursor:pointer;font-weight:600;font-size:0.9rem;">Close</button>
                </div>
            `;
        }

        function openRoomLinksModal(title, roomSlug, controlUrl, displayUrl, triggerEl) {
            openModal(renderRoomLinksModal(title, roomSlug, controlUrl, displayUrl), triggerEl);
        }

        // Load saved card order from localStorage
        function loadCardOrder() {
            const saved = localStorage.getItem('dashboardCardOrder');
            if (saved) {
                try {
                    cardOrder = JSON.parse(saved);
                } catch (e) {
                    cardOrder = [];
                }
            }
        }

        // Save card order to localStorage
        function saveCardOrder() {
            localStorage.setItem('dashboardCardOrder', JSON.stringify(cardOrder));
        }

        // Sort rooms by custom order, keeping new rooms at the end
        function sortRoomsByOrder(rooms) {
            const roomIds = rooms.map(r => r.id);
            
            // Remove deleted rooms from saved order
            cardOrder = cardOrder.filter(id => roomIds.includes(id));
            
            // Add new rooms to the end of the order
            roomIds.forEach(id => {
                if (!cardOrder.includes(id)) {
                    cardOrder.push(id);
                }
            });
            
            // Sort rooms by the card order
            return [...rooms].sort((a, b) => {
                const indexA = cardOrder.indexOf(a.id);
                const indexB = cardOrder.indexOf(b.id);
                return indexA - indexB;
            });
        }

        async function fetchRooms() {
            try {
                const response = await authFetch('/api/rooms');
                if (!response.ok) throw new Error('Failed to fetch rooms');
                
                roomsData = await response.json();
                updateDashboard();
            } catch (error) {
                console.error('Error fetching rooms:', error);
                document.getElementById('roomsContainer').innerHTML = 
                    '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Unable to load rooms</div></div>';
            }
        }

        function updateDashboard() {
            const container = document.getElementById('roomsContainer');

            // Update header stats
            document.getElementById('totalRooms').textContent = roomsData.length;
            const totalConnections = roomsData.reduce((sum, room) => sum + room.connections, 0);
            document.getElementById('totalConnections').textContent = totalConnections;

            if (roomsData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏱️</div>
                        <div class="empty-state-text">No active rooms</div>
                        <div class="empty-state-hint">Create a room using the field above to get started</div>
                    </div>
                `;
                updateSelectionUI();
                return;
            }

            // Keep rooms in custom order
            const sortedRooms = sortRoomsByOrder(roomsData);

            container.innerHTML = sortedRooms.map(room => {
                let displayTime;
                let timerClass;
                let modeIcon;
                let modeText;

                if (room.outputMode === 'clock') {
                    const now = new Date();
                    displayTime = now.toLocaleTimeString('en-GB');
                    timerClass = 'clock';
                    modeIcon = '🕐';
                    modeText = 'Clock Mode';
                } else if (room.countUp && room.overMs > 0) {
                    // Overtime: timer has passed zero, showing elapsed over time
                    const overMin = Math.floor(room.overMs / 60000);
                    const overSec = Math.floor((room.overMs % 60000) / 1000);
                    displayTime = `-${overMin.toString().padStart(2, '0')}:${overSec.toString().padStart(2, '0')}`;
                    timerClass = 'red';
                    modeIcon = '⏱️';
                    modeText = 'Overtime';
                } else {
                    const minutes = Math.floor(room.remainingMs / 60000);
                    const seconds = Math.floor((room.remainingMs % 60000) / 1000);
                    displayTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    const amber = room.amberThresholdMs || 5 * 60 * 1000;
                    const red = room.redThresholdMs || 2 * 60 * 1000;
                    if (room.remainingMs <= red) {
                        timerClass = 'red';
                    } else if (room.remainingMs <= amber) {
                        timerClass = 'amber';
                    } else {
                        timerClass = '';
                    }
                    modeIcon = '⏱️';
                    modeText = 'Timer Mode';
                }

                const isSelected = selectedRooms.has(room.id);
                // room.clientName is only present when viewing as a platform admin
                // (see GET /api/rooms in server.js) - it's the signal every action
                // function below uses to decide whether to hit the client-scoped,
                // slug-addressed endpoints (unchanged from Phase 2) or the
                // platform-admin, id-addressed /api/admin/rooms/:id/* endpoints.
                const clientBadge = room.clientName
                    ? `<div style="font-size:0.75rem;color:#ba68c8;margin-top:2px;">Client: ${escapeHtml(room.clientName)}</div>`
                    : '';
                const pauseBtn = room.mode === 'running'
                    ? `<button onclick="toggleRoomTimer('${escapeHtml(room.id)}', 'running')" class="action-btn primary-action" style="background:#ff9800;border-color:#ff9800;color:white;">⏸️ Pause</button>`
                    : room.mode === 'paused'
                        ? `<button onclick="toggleRoomTimer('${escapeHtml(room.id)}', 'paused')" class="action-btn primary-action" style="background:#4caf50;border-color:#4caf50;color:white;">▶️ Resume</button>`
                        : `<button onclick="toggleRoomTimer('${escapeHtml(room.id)}', 'stopped')" class="action-btn primary-action" style="background:#4caf50;border-color:#4caf50;color:white;">▶️ Start</button>`;

                return `
                    <div class="room-card ${room.mode}"
                         draggable="true"
                         data-room-id="${escapeHtml(room.id)}"
                         ondragstart="handleDragStart(event)"
                         ondragover="handleDragOver(event)"
                         ondrop="handleDrop(event)"
                         ondragend="handleDragEnd(event)"
                         ondragenter="handleDragEnter(event)"
                         ondragleave="handleDragLeave(event)">
                        <div class="drag-handle">⋮⋮</div>
                        <div class="room-header">
                            <div style="display:flex;align-items:center;gap:8px;">
                                <input type="checkbox" class="room-checkbox"
                                       data-room-id="${escapeHtml(room.id)}"
                                       ${isSelected ? 'checked' : ''}
                                       onchange="onCheckboxChange(this)"
                                       style="width:16px;height:16px;cursor:pointer;accent-color:#4caf50;"
                                       onclick="event.stopPropagation()">
                                <div>
                                    <div class="room-name">${escapeHtml(room.slug)}</div>
                                    ${clientBadge}
                                </div>
                            </div>
                            <div class="room-status ${room.mode}">${room.mode}</div>
                        </div>

                        <div class="room-timer">
                            <div class="timer-display ${timerClass}">${displayTime}</div>
                            <div class="timer-mode">${modeIcon} ${modeText}</div>
                        </div>

                        <div class="room-info">
                            <div class="info-item">
                                <div class="info-label">Connections</div>
                                <div class="info-value">👥 ${room.connections}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Ending At</div>
                                <div class="info-value">${room.mode === 'running' ? getEndingTime(room.remainingMs) : '—'}</div>
                            </div>
                        </div>

                        <div class="room-actions">
                            ${pauseBtn}
                            <div class="room-actions-row">
                                <a href="${room.controlUrl}" class="action-btn control" target="_blank">
                                    📱 Control Panel
                                </a>
                                <a href="${room.displayUrl}" class="action-btn display" target="_blank">
                                    🖥️ Display
                                </a>
                            </div>
                            <div class="room-actions-row">
                                <button onclick="regenerateLinks('${escapeHtml(room.id)}', this)" class="action-btn secondary-action" style="background:#455a64;border-color:#455a64;color:white;">
                                    🔄 New Links
                                </button>
                                <button onclick="deleteRoom('${escapeHtml(room.id)}')" class="action-btn danger secondary-action">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            updateSelectionUI();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getEndingTime(remainingMs) {
            const endTime = new Date(Date.now() + remainingMs);
            const hours = endTime.getHours().toString().padStart(2, '0');
            const minutes = endTime.getMinutes().toString().padStart(2, '0');
            const seconds = endTime.getSeconds().toString().padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        // Initial fetch
        loadCardOrder();
        refreshWhoAmI().then(fetchRooms);

        // Auto-refresh every 1 second for live updates
        setInterval(fetchRooms, 1000);

        // Every room-scoped action (pause/resume/start/delete/regenerate) has to hit
        // one of two different endpoint families depending on who's asking:
        //  - a normal client: the slug-addressed /api/rooms/:slug/* routes (Phase 2,
        //    unchanged - a client can only ever reach its own rooms this way anyway)
        //  - a platform admin: the id-addressed /api/admin/rooms/:id/* routes, since
        //    slugs collide across clients by design and only id is unambiguous.
        // room.clientName is only ever populated by the platform-admin listing (see
        // GET /api/rooms in server.js), so its presence is the routing signal.
        function roomActionUrl(room, action) {
            const base = room.clientName
                ? `/api/admin/rooms/${encodeURIComponent(room.id)}`
                : `/api/rooms/${encodeURIComponent(room.slug)}`;
            return action ? `${base}/${action}` : base;
        }

        // Toggle a single room's timer via REST API
        async function toggleRoomTimer(id, currentMode) {
            const room = roomsData.find(r => r.id === id);
            if (!room) return;
            try {
                let endpoint;
                if (currentMode === 'running') {
                    endpoint = 'pause';
                } else if (currentMode === 'paused') {
                    endpoint = 'resume';
                } else {
                    endpoint = 'start';
                }
                await authFetch(roomActionUrl(room, endpoint), { method: 'POST' });
                await fetchRooms();
            } catch (error) {
                console.error('Error toggling timer:', error);
            }
        }

        // Start all stopped/paused rooms simultaneously - client-scoped only.
        // Platform-wide Start All deliberately does not exist (see Phase 3 notes) -
        // the button is hidden for a platform admin, and this is a defensive
        // second check in case of stale UI state.
        async function startAllRooms() {
            if (isPlatformAdmin) return;
            const targets = roomsData.filter(r => r.mode !== 'running');
            if (targets.length === 0) return;
            await Promise.all(targets.map(r => {
                const endpoint = r.mode === 'paused' ? 'resume' : 'start';
                return authFetch(roomActionUrl(r, endpoint), { method: 'POST' });
            }));
            await fetchRooms();
        }

        // Stop (pause) all running rooms simultaneously. For a normal client this is
        // unchanged from Phase 2 (no confirmation, scoped to their own rooms - roomsData
        // only ever contains those). For a platform admin this is a real emergency/
        // support action spanning every client, so it requires explicit confirmation
        // naming the scope before running.
        async function stopAllRooms() {
            const targets = roomsData.filter(r => r.mode === 'running');
            if (targets.length === 0) return;

            if (isPlatformAdmin) {
                const clientCount = new Set(targets.map(r => r.clientName)).size;
                const confirmMsg = `Stop ALL running rooms across ALL clients?\n\nThis will pause ${targets.length} room(s) across ${clientCount} client(s), platform-wide.\n\nContinue?`;
                if (!confirm(confirmMsg)) return;
            }

            await Promise.all(targets.map(r =>
                authFetch(roomActionUrl(r, 'pause'), { method: 'POST' })
            ));
            await fetchRooms();
        }

        // Start selected rooms - a deliberately hand-picked subset (via the
        // checkboxes), not a blanket action, so this stays available for a platform
        // admin too (e.g. starting two specific rooms across two different clients
        // together) even though blanket Start All does not.
        async function startSelectedRooms() {
            const targets = roomsData.filter(r => selectedRooms.has(r.id) && r.mode !== 'running');
            if (targets.length === 0) return;
            await Promise.all(targets.map(r => {
                const endpoint = r.mode === 'paused' ? 'resume' : 'start';
                return authFetch(roomActionUrl(r, endpoint), { method: 'POST' });
            }));
            await fetchRooms();
        }

        // Update checkbox-driven selection state and header button
        function onCheckboxChange(checkbox) {
            const roomId = checkbox.dataset.roomId;
            if (checkbox.checked) selectedRooms.add(roomId);
            else selectedRooms.delete(roomId);
            updateSelectionUI();
        }

        function updateSelectionUI() {
            // Prune selected rooms that no longer exist
            const existingIds = new Set(roomsData.map(r => r.id));
            for (const id of selectedRooms) {
                if (!existingIds.has(id)) selectedRooms.delete(id);
            }
            const btn = document.getElementById('startSelectedBtn');
            if (!btn) return;
            if (selectedRooms.size > 0) {
                btn.style.display = 'inline-block';
                btn.textContent = `▶ Start Selected (${selectedRooms.size})`;
            } else {
                btn.style.display = 'none';
            }
        }

        async function deleteRoom(id) {
            const room = roomsData.find(r => r.id === id);
            if (!room) return;

            // Platform-admin actions on another client's room get an extra-explicit
            // confirmation naming the client; a normal client's own-room confirmation
            // is unchanged from Phase 2.
            const confirmMsg = room.clientName
                ? `Delete room "${room.slug}" belonging to client "${room.clientName}"?\n\nThis will:\n• Remove the room permanently\n• Disconnect all connected clients\n• Cannot be undone\n\nDelete this room?`
                : `Are you sure you want to delete room "${room.slug}"?\n\nThis will:\n• Remove the room permanently\n• Disconnect all connected clients\n• Cannot be undone\n\nDelete this room?`;

            if (!confirm(confirmMsg)) {
                return;
            }

            try {
                const response = await authFetch(roomActionUrl(room, ''), {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete room');
                }

                // Immediately refresh the room list
                await fetchRooms();

                // Show success message briefly
                alert(`✅ Room "${room.slug}" deleted successfully`);
            } catch (error) {
                console.error('Error deleting room:', error);
                alert('❌ Failed to delete room. Please try again.');
            }
        }

        // Drag and Drop Handlers
        function handleDragStart(event) {
            draggedElement = event.target;
            event.target.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/html', event.target.innerHTML);
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(event) {
            const target = event.target.closest('.room-card');
            if (target && target !== draggedElement) {
                target.classList.add('drag-over');
            }
        }

        function handleDragLeave(event) {
            const target = event.target.closest('.room-card');
            if (target) {
                target.classList.remove('drag-over');
            }
        }

        function handleDrop(event) {
            event.stopPropagation();
            event.preventDefault();
            
            const target = event.target.closest('.room-card');
            if (!target || target === draggedElement) {
                return false;
            }
            
            // Get the room IDs
            const draggedRoomId = draggedElement.dataset.roomId;
            const targetRoomId = target.dataset.roomId;
            
            // Update the card order
            const draggedIndex = cardOrder.indexOf(draggedRoomId);
            const targetIndex = cardOrder.indexOf(targetRoomId);
            
            if (draggedIndex !== -1 && targetIndex !== -1) {
                // Remove dragged item from its position
                cardOrder.splice(draggedIndex, 1);
                
                // Insert it at the target position
                const newTargetIndex = cardOrder.indexOf(targetRoomId);
                cardOrder.splice(newTargetIndex, 0, draggedRoomId);
                
                // Save and update
                saveCardOrder();
                updateDashboard();
            }
            
            return false;
        }

        function handleDragEnd(event) {
            event.target.classList.remove('dragging');
            
            // Remove all drag-over classes
            document.querySelectorAll('.room-card').forEach(card => {
                card.classList.remove('drag-over');
            });
            
            draggedElement = null;
        }
    </script>
</body>
</html>
